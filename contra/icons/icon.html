<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CONTRA icon renderer</title>
<style>html,body{margin:0;background:#05060a}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Renders the CONTRA app icon at any size. Size comes from ?s=NNN (default 1024).
// Full-bleed dark square (iOS applies its own corner mask) with a jungle horizon,
// palm silhouettes, and a heavy gunmetal-to-ember "C" arc as the mark. Drawn as
// paths only — no webfonts, so it rasterises identically in a bare container.
'use strict';
const S = parseInt(new URLSearchParams(location.search).get('s') || '1024', 10);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = cv.height = S;
const u = S / 1024;                          // scale factor from the 1024 master
function px(v){ return v * u; }
const TAU = Math.PI * 2;

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// one palm: a curved trunk with fronds fanned off the crown
function palm(x, base, h, lean, col){
  ctx.strokeStyle = col; ctx.lineCap = 'round';
  ctx.lineWidth = px(13);
  ctx.beginPath();
  ctx.moveTo(x, base);
  ctx.quadraticCurveTo(x + lean * 0.35, base - h * 0.55, x + lean, base - h);
  ctx.stroke();
  const cx = x + lean, cy = base - h;
  ctx.lineWidth = px(9);
  for (let i = 0; i < 7; i++){
    const a = -Math.PI * 0.94 + i * (Math.PI * 0.88 / 6);
    const L = h * (0.40 + (i % 2 ? 0.10 : 0));
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(cx + Math.cos(a) * L * 0.6, cy + Math.sin(a) * L * 0.6 - px(26),
                         cx + Math.cos(a) * L,       cy + Math.sin(a) * L + px(16));
    ctx.stroke();
  }
}

function draw(){
  // full-bleed background
  ctx.fillStyle = '#05060a';
  ctx.fillRect(0, 0, S, S);

  // warm ember glow behind the mark
  let g = ctx.createRadialGradient(S/2, S*0.46, S*0.04, S/2, S*0.5, S*0.66);
  g.addColorStop(0, 'rgba(230,57,70,0.30)');
  g.addColorStop(0.55, 'rgba(230,57,70,0.07)');
  g.addColorStop(1, 'rgba(5,6,10,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);

  // jungle horizon — layered ridges, darkest at the back
  const ridges = [[0.735, '#0b1622'], [0.775, '#0d1b28'], [0.815, '#101f2c']];
  for (const [yf, col] of ridges){
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, S);
    ctx.lineTo(0, S * yf);
    for (let i = 0; i <= 8; i++){
      const x = S * i / 8;
      const y = S * yf - Math.sin(i * 1.7 + yf * 40) * px(26) - px(10);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(S, S); ctx.closePath(); ctx.fill();
  }
  // palms against the ridges
  palm(S * 0.145, S * 0.845, S * 0.30, px(-40), '#0a141d');
  palm(S * 0.870, S * 0.860, S * 0.26, px(34),  '#0a141d');

  // inset frame, kept clear of the iOS corner rounding
  const inset = px(74), rad = px(150);
  ctx.lineWidth = px(7);
  ctx.strokeStyle = 'rgba(230,57,70,0.85)';
  ctx.shadowColor = '#e63946'; ctx.shadowBlur = px(26);
  rr(inset, inset, S - inset*2, S - inset*2, rad); ctx.stroke();
  ctx.shadowBlur = 0;

  // the mark: a heavy "C" arc, gap facing right
  const cx = S/2, cy = S*0.485, r = px(268);
  g = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  g.addColorStop(0,    '#ffd23f');
  g.addColorStop(0.45, '#ff7a2f');
  g.addColorStop(1,    '#e03b26');
  ctx.lineCap = 'butt';
  ctx.lineWidth = px(150);
  // dark backing so the arc reads against the glow
  ctx.strokeStyle = '#05060a';
  ctx.beginPath(); ctx.arc(cx, cy, r, TAU*0.085, TAU*0.915); ctx.stroke();
  ctx.lineWidth = px(126);
  ctx.strokeStyle = g;
  ctx.shadowColor = 'rgba(255,122,47,0.85)'; ctx.shadowBlur = px(38);
  ctx.beginPath(); ctx.arc(cx, cy, r, TAU*0.088, TAU*0.912); ctx.stroke();
  ctx.shadowBlur = 0;

  // muzzle spark in the arc's mouth
  const sx = cx + r * 0.96, sy = cy;
  ctx.fillStyle = '#fff3c4';
  ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = px(30);
  ctx.beginPath();
  for (let i = 0; i < 8; i++){
    const a = i * TAU/8, L = (i % 2 ? px(30) : px(74));
    ctx.lineTo(sx + Math.cos(a) * L, sy + Math.sin(a) * L);
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;

  // scanline texture, matching the game's CRT treatment
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  for (let y = 0; y < S; y += Math.max(2, Math.round(px(6)))) ctx.fillRect(0, y, S, Math.max(1, px(2)));

  // vignette
  g = ctx.createRadialGradient(S/2, S/2, S*0.34, S/2, S/2, S*0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
}

draw();
window.__ready = true;
</script>
</body>
</html>
