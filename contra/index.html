/* --------------------------------------------------------------- collision */
function updateBullets(){
  for(const b of bullets){
    b.t++;
    if(b.flame){ b.base+=0; b.ph+=0.34;
      const s=WEAPONS.F.spd; const off=Math.sin(b.ph)*1.9;
      b.x+=Math.cos(b.base)*s - Math.sin(b.base)*off*0.5;
      b.y+=Math.sin(b.base)*s + Math.cos(b.base)*off*0.5;
    } else { b.x+=b.vx; b.y+=b.vy; }
    if(--b.life<=0) b.dead=true;
    if(b.x<cam.x-20||b.x>cam.x+W+20||b.y<-20||b.y>H+20) b.dead=true;
    /* solids */
    for(const s of solids) if(b.x>s.x&&b.x<s.x+s.w&&b.y>s.y&&b.y<s.y+s.h){ b.dead=true; spark(b.x,b.y,3,'#ffd6a0',1.4,10); }
    /* enemies */
    for(const e of enemies){
      if(e.dead) continue;
      if(b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y){
        hurtEnemy(e,b.dmg); if(!b.pierce) b.dead=true; break;
      }
    }
    /* pickups (falcon) */
    for(const f of pickups) if(f.type==='falcon'&&!f.dead&&b.x<f.x+f.w&&b.x+b.w>f.x&&b.y<f.y+f.h&&b.y+b.h>f.y){
      f.dead=true; b.dead=true; explode(f.x+8,f.y+6,false);
      pickups.push(mkItem(f.x, f.y, f.wp)); score+=300;
    }
    /* boss */
    if(boss&&!boss.dying){
      for(const pod of boss.pods) if(!pod.dead&&hitBox(b,pod)){
        if(pod.shut){                       /* armoured: rounds spark off */
          if(!b.pierce) b.dead=true;
          spark(b.x,b.y,3,'#9fb4c8',1.5,10); Audio_.tone(320,0.03,'square',0.05,0.7);
          break;
        }
        if(boss.kind==='thaw' && pod.ice>0){        /* the shell eats it first */
          pod.ice-=b.dmg; pod.cold=0; pod.flash=2;
          if(!b.pierce) b.dead=true;
          spark(b.x,b.y,5,'#dff2ff',1.8,14); Audio_.tone(520,0.04,'square',0.07,0.8);
          if(pod.ice<=0){ pod.ice=0; spark(pod.x+13,pod.y+13,10,'#eaf7ff',2.4,20); }
          break;
        }
        if(boss.kind==='thaw') pod.cold=0;
        pod.hp-=b.dmg; pod.flash=4; if(!b.pierce)b.dead=true; spark(b.x,b.y,4,'#ffd6a0',1.6,12); Audio_.hit();
        if(pod.hp<=0){ pod.dead=true; explode(pod.x+13,pod.y+13,true); score+=1500; floatText(pod.x,pod.y,'1500','#ffd23f'); }
        break;
      }
      const c=boss.core;
      if(!b.dead&&hitBox(b,c)){
        const shielded =
          (boss.kind==='sluice'  && boss.pods.some(g=>!g.dead)) ||
          (boss.kind==='press'   && !boss.up) ||
          (boss.kind==='reactor' && !coreOpen());
        if(shielded){
          if(!b.pierce) b.dead=true;
          spark(b.x,b.y,3,'#9fb4c8',1.5,10); Audio_.tone(320,0.03,'square',0.05,0.7);
          break;
        }
        c.hp-=b.dmg; c.flash=4; if(!b.pierce)b.dead=true; spark(b.x,b.y,5,'#8be9ff',1.8,14); Audio_.hit();
        if(c.hp<=0){ boss.dying=1; score+=8000; explode(c.x+11,c.y+11,true); Audio_.boom(true); shake=12; hitstop=10; }
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);

  for(const b of ebullets){
    b.t++;
    if(b.arc) b.vy+=GRAV*0.5;
    b.x+=b.vx; b.y+=b.vy;
    if(--b.life<=0) b.dead=true;
    if(b.x<cam.x-30||b.x>cam.x+W+30||b.y>H+10||b.y<-30) b.dead=true;
    if(b.arc && b.y>GY-4){ b.dead=true; explode(b.x,GY-2,false); if(Math.abs(b.x-(player.x+5))<16&&player.y>GY-30) killPlayer(); }
    if(!player.dead && player.inv<=0 && aabb(b,hb(player))){ b.dead=true; killPlayer(); }
  }
  ebullets=ebullets.filter(b=>!b.dead);
}
function hitBox(b,o){ return b.x<o.x+o.w&&b.x+b.w>o.x&&b.y<o.y+o.h&&b.y+b.h>o.y; }
function hurtEnemy(e,d){
  e.hp-=d; e.flash=4; spark(e.x+e.w/2,e.y+e.h/2,4,'#ffd6a0',1.6,12);
  Audio_.hit();
  if(e.hp<=0){
    e.dead=true; score+=e.score; floatText(e.x,e.y,e.score,'#ffe27a');
    explode(e.x+e.w/2,e.y+e.h/2, e.score>=500);
  }
}
function updatePickups(){
  for(const f of pickups){
    if(f.type==='falcon'){
      f.t++; f.x+=f.vx; f.y=60+Math.sin(f.t*0.045)*30;
      if(f.x>cam.x+W+30||f.x<cam.x-60) f.dead=true;
    } else {
      f.vy=Math.min(4,f.vy+GRAV*0.6); f.y+=f.vy;
      for(const pl of plats){ if(f.x+f.w>pl.x&&f.x<pl.x+pl.w&&f.y+f.h>=pl.y&&f.y+f.h<=pl.y+f.vy+4&&f.vy>0){ f.y=pl.y-f.h; f.vy=0; } }
      if(f.y>H+20) f.dead=true;
      if(--f.life<=0) f.dead=true;
      if(!player.dead && aabb({x:f.x,y:f.y,w:f.w,h:f.h},{x:player.x,y:player.y,w:player.w,h:PH})){
        f.dead=true; grantWeapon(f.wp);
      }
    }
  }
  pickups=pickups.filter(f=>!f.dead);
}
function grantWeapon(wp){
  if(wp==='B'){ player.barrier=600; floatText(player.x,player.y-8,'BARRIER','#c9a8ff'); }
  else { weapon=wp; floatText(player.x,player.y-8,WEAPONS[wp].name,'#7dffa1'); }
  score+=500; Audio_.power();
}
function updateParts(){
  for(const p of parts){
    p.t++;
    if(p.ring){ p.r=lerp(1,p.rmax,p.t/p.life); }
    else if(p.smoke){ p.x+=p.vx*0.4; p.y+=p.vy; p.vy*=0.97; p.r+=0.16; }
    else if(p.flash){ }
    else { p.vx*=0.985; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; }
    if(p.t>=p.life) p.dead=true;
  }
  parts=parts.filter(p=>!p.dead);
  for(const f of floats){ f.t++; f.y-=0.35; if(f.t>=f.life) f.dead=true; }
  floats=floats.filter(f=>!f.dead);
}

/* ----------------------------------------------------------------- camera */
function updateCamera(){
  if(cam.lock){ cam.x=lerp(cam.x, LVL_W-W, 0.10); return; }
  /* touch: frame the player centred, clear of the thumb on the stick.
     desktop keeps the original 38% lead (more of the level visible ahead). */
  const target=clamp(player.x - W*(isTouch?0.50:0.38), 0, LVL_W-W);
  /* follows both ways: you can walk back for enemies left behind. cam.max remembers
     the furthest point reached, so retreating doesn't cull the wave ahead of you */
  cam.x = clamp(lerp(cam.x,target,0.12), 0, LVL_W-W);
  cam.max = Math.max(cam.max, cam.x);
  for(const s of spawns) if(!s.done && cam.max>=s.x){ s.done=true; s.fn(); }
}

/* ------------------------------------------------------------------- draw */
function drawParallax(g){
  const t=frame;
  /* far */
  const fx=-(cam.x*0.14)%512;
  for(let i=-1;i<2;i++) g.drawImage(bgFar, Math.round(fx+i*512), 0);
  /* drifting clouds/fog */
  g.globalAlpha=0.10;
  for(let i=0;i<4;i++){
    const x=((i*130 - cam.x*0.06 - t*0.14)%(W+180))-90;
    const y=54+i*11;
    g.fillStyle= {1:'#ffd9c0',2:'#bfe6ea',3:'#dce8f8',4:'#4a3a30',5:'#6b2a18'}[stage]||'#ffd9c0';
    g.beginPath(); g.ellipse(x,y,52,6,0,0,TAU); g.fill();
  }
  g.globalAlpha=1;
  const mx=-(cam.x*0.34)%480;
  for(let i=-1;i<2;i++) g.drawImage(bgMid, Math.round(mx+i*480), 0);
  if(stage===2) drawFalls(g);
  const nx=-(cam.x*0.62)%420;
  for(let i=-1;i<2;i++) g.drawImage(bgNear, Math.round(nx+i*420), Math.round(2+Math.sin(t*0.01)*1));
}
/* ----------------------------------------------------- lighting and bloom */
/* Lights and bright pixels are accumulated into a half-resolution buffer which is
   composited back with 'lighter'. Upscaling that small buffer with smoothing on IS
   the blur, so a single cheap layer buys dynamic light and bloom at once. */
const LW=W>>1, LH=H>>1, LS=0.5;
const lightCv=makeLayer(LW,LH,()=>{}), lightCx=lightCv.getContext('2d');
let lights=[];
/* one radial sprite per colour, built once and reused — building gradients per light
   per frame cost ~6x the whole previous frame budget */
const blobCache=new Map();
function blob(col){
  let c=blobCache.get(col);
  if(!c){
    c=makeLayer(64,64,(g)=>{
      const gr=g.createRadialGradient(32,32,0,32,32,32);
      gr.addColorStop(0,col); gr.addColorStop(0.45,col.replace(/[\d.]+\)$/,'0.30)'));
      gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.fillRect(0,0,64,64);
    });
    blobCache.set(col,c);
  }
  return c;
}
function addLight(x,y,r,col,life){ lights.push({x,y,r,col,life,t:0}); }
function updateLights(){
  for(const L of lights) L.t++;
  lights=lights.filter(L=>L.t<L.life);
}
function drawLights(g){
  const lc=lightCx;
  lc.clearRect(0,0,LW,LH);
  lc.globalCompositeOperation='lighter';
  const put=(wx,wy,r,col,a)=>{
    const x=(wx-cam.x)*LS, y=wy*LS, rr=r*LS;
    if(rr<=0 || x<-rr || x>LW+rr) return;
    lc.globalAlpha=clamp(a,0,1);
    lc.drawImage(blob(col), x-rr, y-rr, rr*2, rr*2);   /* cached sprite, not a fresh gradient */
  };
  for(const L of lights){ const k=1-L.t/L.life; put(L.x,L.y,L.r*(0.55+0.45*k),L.col,k*k); }
  /* every shot in flight is a small moving lamp */
  for(const b of bullets){
    const L = b.kind==='L' ? [26,'rgba(139,233,255,.9)'] :
              b.kind==='F' ? [22,'rgba(255,150,70,.9)'] : [14,'rgba(255,240,180,.8)'];
    put(b.x+1.5,b.y+1.5,L[0],L[1],0.6);
  }
  for(const b of ebullets) put(b.x+b.w/2,b.y+b.h/2,13,'rgba(255,130,70,.85)',0.5);
  if(player && !player.dead && player.shield>0)
    put(player.x+5,player.y+11,player.shieldFlash>0?34:20,'rgba(127,227,255,.55)',
        player.shieldFlash>0?0.75:0.28);
  lc.globalAlpha=1; lc.globalCompositeOperation='source-over';

  g.save();
  g.globalCompositeOperation='lighter';
  g.imageSmoothingEnabled=true;
  g.globalAlpha=0.90; g.drawImage(lightCv,0,0,LW,LH,0,0,W,H);
  g.globalAlpha=0.40; g.drawImage(lightCv,0,0,LW,LH,-5,-5,W+10,H+10);  /* wider, softer halo */
  g.restore();
}

/* Airborne dust and embers, parallaxed at three depths. Per-mote constants are baked
   once and the alphas are quantised into a few buckets, so this costs 5 fillStyle
   changes a frame instead of 44 freshly-built colour strings. */
const MOTE_N=44;
const MOTE_PAL={
  1:['rgba(255,214,170,.05)','rgba(255,214,170,.08)','rgba(255,214,170,.11)',
     'rgba(255,216,176,.14)','rgba(255,220,184,.17)'],
  2:['rgba(198,236,244,.06)','rgba(206,240,248,.09)','rgba(214,244,250,.13)',
     'rgba(226,248,252,.17)','rgba(240,252,255,.21)'],
  3:['rgba(232,244,255,.10)','rgba(238,248,255,.16)','rgba(244,250,255,.22)',
     'rgba(250,253,255,.30)','rgba(255,255,255,.38)'],
  4:['rgba(255,176,46,.05)','rgba(255,170,60,.08)','rgba(255,164,70,.11)',
     'rgba(255,180,90,.14)','rgba(255,196,120,.17)'],
  5:['rgba(255,140,50,.07)','rgba(255,150,60,.11)','rgba(255,166,70,.15)',
     'rgba(255,186,96,.20)','rgba(255,214,140,.25)'] };
let MOTE_A=MOTE_PAL[1];
const MOTES=[];
for(let i=0;i<MOTE_N;i++) MOTES.push({
  d:0.22+(i%3)*0.24, x0:(hash(i*13)*0.5+0.5)*1600,
  y0:34+(hash(i*7)*0.5+0.5)*(H-64), ph:i, ph2:i*2 });
const MOTE_BUCKETS=MOTE_A.map(()=>[]);
function drawMotes(g){
  const t=frame, span=W+40;
  MOTE_A=MOTE_PAL[stage]||MOTE_PAL[1];
  for(const bk of MOTE_BUCKETS) bk.length=0;
  for(let i=0;i<MOTE_N;i++){
    const m=MOTES[i];
    let sx=(m.x0 - cam.x*m.d + Math.sin(t*0.004+m.ph)*16) % span;
    if(sx<0) sx+=span;
    const sy=m.y0 + Math.sin(t*0.011+m.ph2)*5;
    const k=(0.5+0.5*Math.sin(t*0.02+m.ph))*(MOTE_A.length-0.001)|0;
    MOTE_BUCKETS[k].push((sx-20)|0, sy|0);
  }
  for(let k=0;k<MOTE_A.length;k++){
    const bk=MOTE_BUCKETS[k]; if(!bk.length) continue;
    g.fillStyle=MOTE_A[k];
    for(let j=0;j<bk.length;j+=2) g.fillRect(bk[j],bk[j+1],1,1);
  }
}

/* colour grade: cool the shadows, warm the low sun, then a gentle vignette */
const HAS_SOFT=(()=>{ const c=makeLayer(1,1,()=>{}).getContext('2d');
  c.globalCompositeOperation='soft-light'; return c.globalCompositeOperation==='soft-light'; })();
let gradeCv=null, vigCv=null, gradeStage=1;
function grade(g){
  if(gradeCv&&gradeStage!==stage) gradeCv=null;
  if(!gradeCv){
    gradeStage=stage;
    const GRADES={
      1:[[0,'rgba(96,124,200,0.60)'],[0.52,'rgba(255,186,128,0.16)'],[1,'rgba(255,146,86,0.42)']],
      2:[[0,'rgba(70,120,190,0.60)'],[0.52,'rgba(150,220,225,0.16)'],[1,'rgba(90,200,195,0.40)']],
      3:[[0,'rgba(120,160,230,0.55)'],[0.52,'rgba(210,230,255,0.18)'],[1,'rgba(180,210,245,0.34)']],
      4:[[0,'rgba(70,90,130,0.60)'],[0.52,'rgba(255,176,46,0.14)'],[1,'rgba(255,120,50,0.30)']],
      5:[[0,'rgba(120,40,40,0.58)'],[0.52,'rgba(255,150,60,0.20)'],[1,'rgba(255,90,30,0.48)']]};
    const stops = GRADES[stage] || GRADES[1];
    gradeCv=makeLayer(W,H,(c)=>{
      const lg=c.createLinearGradient(0,0,0,H);
      for(const st of stops) lg.addColorStop(st[0],st[1]);
      c.fillStyle=lg; c.fillRect(0,0,W,H);
    });
  }
  if(!vigCv) vigCv=makeLayer(W,H,(c)=>{
    const vg=c.createRadialGradient(W/2,H*0.46,H*0.42,W/2,H*0.5,H*1.02);
    vg.addColorStop(0,'#ffffff'); vg.addColorStop(1,'#9a92ad');
    c.fillStyle=vg; c.fillRect(0,0,W,H);
  });
  g.save();
  if(HAS_SOFT){ g.globalCompositeOperation='soft-light'; g.drawImage(gradeCv,0,0); }
  g.globalCompositeOperation='multiply'; g.drawImage(vigCv,0,0);
  g.restore();
}

function drawWater(g){
  const t=frame;
  for(const p of pits){
    const sx=p.x-cam.x; if(sx>W||sx+p.w<0) continue;
    for(let y=GY+6;y<H;y+=4){
      const off=Math.sin((y*0.6)+t*0.06)*3;
      g.fillStyle=`rgba(120,200,255,${0.05+0.05*Math.sin(t*0.05+y)})`;
      g.fillRect(Math.round(sx+off), y, p.w, 1);
    }
    g.fillStyle='rgba(160,220,255,.18)';
    for(let i=0;i<p.w;i+=9){ const yy=GY+10+Math.sin((i+t*1.6)*0.08)*3; g.fillRect(Math.round(sx+i),Math.round(yy),4,1); }
  }
}
function drawPlayer(g){
  const p=player;
  if(p.dead){
    g.save(); g.translate(Math.round(p.x-cam.x+5), Math.round(p.y+8)); g.rotate(p.spinT);
    const white = (p.deadT<10 && (p.deadT>>1)%2===0);
    blit(g,SPR.ball,-8,-8,false,white); g.restore(); return;
  }
  if(p.inv>0 && (frame>>1)%2===0 && !p.walkOut) return;
  const sx=p.x-cam.x, flip=p.dir<0;
  if(p.barrier>0){
    g.save(); g.globalAlpha=0.35+0.25*Math.sin(frame*0.25);
    g.strokeStyle='#c9a8ff'; g.lineWidth=1;
    g.beginPath(); g.arc(sx+5, p.y+11, 15+Math.sin(frame*0.2), 0, TAU); g.stroke(); g.restore();
  }
  if(p.shield>0 || p.shieldFlash>0){
    g.save();
    const f=p.shieldFlash;
    g.globalAlpha = f>0 ? 0.30+0.55*(f/14) : 0.12+0.05*p.shield+0.04*Math.sin(frame*0.11);
    g.strokeStyle='#7fe3ff'; g.lineWidth=1;
    g.beginPath(); g.arc(sx+5, p.y+11, 13+(f>0?(14-f)*0.45:0), 0, TAU); g.stroke();
    g.restore();
  }
  if(p.prone){ blit(g,SPR.prone, sx-(flip?11:2), p.y+12, flip); drawGunArm(g,sx,p.y+12,true); return; }
  if(!p.onGround){
    g.save(); g.translate(Math.round(sx+5), Math.round(p.y+11));
    g.rotate(p.spinT*p.dir); blit(g,SPR.ball,-8,-8,flip); g.restore(); return;
  }
  blit(g, SPR.run[p.frameI], sx-3, p.y-2, flip);
  drawGunArm(g,sx,p.y,false);
}
function drawGunArm(g,sx,py,prone){
  const p=player;
  const ox=sx+5, oy=py+(prone?4:8);
  const a=p.aim;
  g.save(); g.translate(Math.round(ox),Math.round(oy)); g.rotate(a);
  g.fillStyle='#ffcf9e'; g.fillRect(0,-1,7,3);          /* arm */
  g.fillStyle='#2b2f38'; g.fillRect(5,-2,9,4);           /* gun body */
  g.fillStyle='#6d7784'; g.fillRect(7,-1,7,1);
  g.fillStyle='#1a1d23'; g.fillRect(12,-1,3,2);
  if(p.fireCd>WEAPONS[weapon].cd-4){
    g.fillStyle='#fff6c2'; g.fillRect(14,-2,4,4);
    g.fillStyle='#ffb02e'; g.fillRect(16,-1,3,2);
  }
  g.restore();
}
function drawEnemy(g,e){
  const sx=Math.round(e.x-cam.x), sy=Math.round(e.y);
  const wf=e.flash>0;
  switch(e.type){
    case 'runner': case 'gunner': case 'jumper':{
      const fi = e.type==='gunner'?0:(1+(Math.floor(e.t*0.18)%3));
      blit(g,SPR.erun[e.type==='jumper'?2:fi], sx-2, sy-2, e.dir>0, wf);
      /* muzzle-ish rifle */
      g.fillStyle=wf?'#ffdcd0':'#2b2f38';
      g.fillRect(sx+(e.dir>0?10:-2), sy+8, 6, 2);
      break; }
    case 'turret':{
      /* housing first, barrel on top so it actually reads as aiming */
      g.fillStyle=wf?'#ffdcd0':'#4d5561'; g.fillRect(sx,sy+4,16,10);
      g.fillStyle=wf?'#ffdcd0':'#68727f'; g.fillRect(sx+1,sy+4,14,2);
      g.fillStyle='#23272e'; g.fillRect(sx,sy+12,16,2);
      g.beginPath(); g.fillStyle=wf?'#ffdcd0':'#3b434e'; g.arc(sx+8,sy+7,6,Math.PI,0); g.fill();
      g.save(); g.translate(sx+8, sy+7); g.rotate(e.ang);
      g.fillStyle=wf?'#ffdcd0':'#39404a'; g.fillRect(0,-3,14,6);
      g.fillStyle=wf?'#ffdcd0':'#78838f'; g.fillRect(2,-2,11,1);
      g.fillStyle='#14171c'; g.fillRect(12,-2,4,4); g.restore();
      g.beginPath(); g.fillStyle=(e.fireT<20)?'#ff4d4d':'#7d2b2b'; g.arc(sx+8,sy+7,3,0,TAU); g.fill();
      break; }
    case 'bunker':{
      g.fillStyle=wf?'#ffdcd0':'#4a4238'; g.fillRect(sx,sy,22,22);
      g.fillStyle=wf?'#ffdcd0':'#5d5448'; g.fillRect(sx,sy,22,3);
      g.fillStyle='#211d18'; g.fillRect(sx,sy+19,22,3);
      for(let i=0;i<3;i++){ g.fillStyle='rgba(0,0,0,.3)'; g.fillRect(sx+2+i*7,sy+4,5,14); }
      const oh=Math.round(2+e.open*5);
      g.fillStyle='#0b0d10'; g.fillRect(sx+4,sy+7,14,oh);
      if(e.open>0.5){ g.fillStyle='#e8b183'; g.fillRect(sx+9,sy+8,5,4);
        g.fillStyle='#2b2f38'; g.fillRect(sx+2,sy+10,8,2); }
      g.fillStyle='#c8b53a'; g.fillRect(sx+1,sy+1,3,2); g.fillRect(sx+18,sy+1,3,2);
      break; }
    case 'mortar':{
      g.fillStyle=wf?'#ffdcd0':'#3f4a3a'; g.fillRect(sx,sy+6,16,10);
      g.fillStyle=wf?'#ffdcd0':'#57654f'; g.fillRect(sx,sy+6,16,2);
      g.save(); g.translate(sx+8,sy+8); g.rotate(-1.05);
      g.fillStyle=wf?'#ffdcd0':'#2b2f38'; g.fillRect(-2,-3,14,6); g.fillStyle='#6d7784'; g.fillRect(0,-2,11,1); g.restore();
      g.fillStyle='#23272e'; g.fillRect(sx,sy+14,16,2);
      g.fillStyle=(e.fireT<22)?'#ffd23f':'#6a5a20'; g.fillRect(sx+2,sy+9,3,3);
      break; }
    case 'drone':{
      const bob=Math.sin(e.t*0.2)*1;
      g.fillStyle=wf?'#ffdcd0':'#39404a'; g.fillRect(sx,sy+bob,12,7);
      g.fillStyle=wf?'#ffdcd0':'#59616d'; g.fillRect(sx+1,sy+bob,10,2);
      g.fillStyle='#8be9ff'; g.fillRect(sx+4,sy+3+bob,4,2);
      g.fillStyle='rgba(140,220,255,.35)';
      const wsp=(frame%4<2)?3:1;
      g.fillRect(sx-4,sy+1+bob,4,wsp); g.fillRect(sx+12,sy+1+bob,4,wsp);
      break; }
  }
}
function drawFalcon(g,f){
  const sx=Math.round(f.x-cam.x), sy=Math.round(f.y);
  const flap=Math.sin(f.t*0.22);
  /* wings behind the fuselage, dark with a lit leading edge */
  for(const s of [1,-1]){
    g.save(); g.translate(sx+8,sy+5); g.rotate(flap*0.55*s);
    g.fillStyle='#39414f'; g.fillRect(s>0?0:-10, -1, 10, 4);
    g.fillStyle='#7c8798'; g.fillRect(s>0?0:-10, -1, 10, 1);
    g.restore();
  }
  /* fuselage */
  g.fillStyle='#4a5464'; g.fillRect(sx+3,sy+3,11,6);
  g.fillStyle='#8e99aa'; g.fillRect(sx+3,sy+3,11,1);
  g.fillStyle='#232a35'; g.fillRect(sx+3,sy+8,11,1);
  g.fillStyle='#101419'; g.fillRect(sx+13,sy+4,3,4);          /* nose */
  /* pulsing carrier light */
  const pl=0.55+0.45*Math.sin(f.t*0.3);
  g.fillStyle=`rgba(255,60,70,${pl})`; g.fillRect(sx+9,sy+5,3,2);
  g.fillStyle=`rgba(255,180,190,${pl*0.9})`; g.fillRect(sx+10,sy+5,1,1);
  /* thruster wash */
  g.fillStyle=`rgba(255,200,90,${0.35+0.25*Math.sin(f.t*0.5)})`; g.fillRect(sx,sy+5,3,2);
  g.fillStyle='rgba(255,140,60,.25)'; g.fillRect(sx-3,sy+6,3,1);
}
function drawItem(g,f){
  const sx=Math.round(f.x-cam.x), sy=Math.round(f.y);
  const bl=f.life<180 && (frame>>2)%2===0;
  if(bl) return;
  g.fillStyle='#e63946'; g.fillRect(sx,sy,15,12);
  g.fillStyle='#ff7b84'; g.fillRect(sx,sy,15,1); g.fillRect(sx,sy,1,12);
  g.fillStyle='#8d1c26'; g.fillRect(sx,sy+11,15,1); g.fillRect(sx+14,sy,1,12);
  g.fillStyle='#241318'; g.fillRect(sx+2,sy+2,11,8);
  drawText(g,f.wp,sx+5,sy+3,'#ffe27a',1);
  g.globalAlpha=0.25+0.2*Math.sin(frame*0.18); g.fillStyle='#fff'; g.fillRect(sx,sy,15,12); g.globalAlpha=1;
}

/* shared chrome for the three later bosses: a mounting spine and a labelled bar */
function bossFrame(g,label,col,total,max){
  const bx=boss.x-cam.x;
  g.fillStyle='#2a2f38'; g.fillRect(bx-8,16,12,148);
  g.fillStyle='#3d444f'; g.fillRect(bx-8,16,12,3);
  g.fillStyle='#171b20'; g.fillRect(bx-8,161,12,3);
  for(let i=22;i<160;i+=13){ g.fillStyle='#5b6470'; g.fillRect(bx-6,i,3,3); g.fillRect(bx,i,3,3); }
  if(boss.dying) return;
  const frac=clamp(total/max,0,1), lw=textW(label,1);
  g.fillStyle='rgba(6,8,12,.72)'; g.fillRect(W-132,14,128,9);
  drawText(g,label,W-129,16,col,1);
  const bw=118-lw-6, bx0=W-129+lw+6;
  g.fillStyle='#2a1a1e'; g.fillRect(bx0,17,bw,3);
  g.fillStyle= frac>0.5?col: frac>0.22?'#ffb02e':'#ff2f4d';
  g.fillRect(bx0,17,Math.round(bw*frac),3);
  g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(bx0,17,Math.round(bw*frac),1);
}
function podShell(g,pod,body,trim){
  const px=pod.x-cam.x, py=pod.y, wf=pod.flash>0;
  g.fillStyle=wf?'#ffdcd0':body; g.fillRect(px,py,26,26);
  g.fillStyle=wf?'#ffdcd0':trim; g.fillRect(px+1,py+1,24,2);
  g.fillStyle='#22262c'; g.fillRect(px+1,py+23,24,2);
  g.beginPath(); g.fillStyle=wf?'#ffdcd0':'#333a44'; g.arc(px+13,py+13,10,0,TAU); g.fill();
  g.save(); g.translate(px+13,py+13); g.rotate(pod.ang||Math.PI);
  g.fillStyle=wf?'#ffdcd0':'#39404a'; g.fillRect(0,-4,18,8);
  g.fillStyle='#14171c'; g.fillRect(15,-3,4,6); g.restore();
}
function podWreck(g,pod,ember){
  const px=pod.x-cam.x, py=pod.y;
  g.fillStyle='#161a1f'; g.fillRect(px,py,26,26);
  g.fillStyle='#0a0c0f'; g.fillRect(px+4,py+4,18,18);
  if(frame%9<4){ g.fillStyle=ember; g.fillRect(px+6+rndi(0,10),py+6+rndi(0,10),3,3); }
}
function drawThaw(g){
  for(const pod of boss.pods){
    if(pod.dead){ podWreck(g,pod,'#9fe8ff'); continue; }
    podShell(g,pod,'#4b5a66','#6b7d8a');
    if(pod.ice>0){                                  /* the shell, thickness = hp left */
      const px=pod.x-cam.x, py=pod.y, k=pod.ice/pod.iceMax;
      g.save(); g.globalAlpha=0.35+0.45*k;
      g.fillStyle='#cfeaff'; g.fillRect(px-2,py-2,30,30);
      g.globalAlpha=0.30+0.30*k; g.fillStyle='#ffffff';
      g.fillRect(px-2,py-2,30,3); g.fillRect(px-2,py-2,3,30);
      g.restore();
      g.fillStyle='rgba(255,255,255,.55)';
      for(let i=0;i<4;i++) g.fillRect(px+2+i*7, py+3+((i*5)%18), 2, 6);
    }
  }
  const c=boss.core, cx=c.x-cam.x, pulse=0.5+0.5*Math.sin(frame*0.14);
  g.fillStyle=c.flash>0?'#ffdcd0':'#2c323b'; g.fillRect(cx-3,c.y-3,30,30);
  g.fillStyle='#8a96a5'; g.fillRect(cx-3,c.y-3,30,2);
  g.fillStyle='#12161b'; g.fillRect(cx,c.y,24,24);
  const hpr=clamp(c.hp/c.hpMax,0,1);
  g.beginPath(); g.fillStyle=`rgba(120,${180+60*hpr|0},255,${0.30+0.22*pulse})`; g.arc(cx+12,c.y+12,11,0,TAU); g.fill();
  g.beginPath(); g.fillStyle=`rgba(200,240,255,${0.70+0.30*pulse})`; g.arc(cx+12,c.y+12,6,0,TAU); g.fill();
  if(boss.pods.some(o=>!o.dead)){                    /* show that it is knitting back */
    g.fillStyle='rgba(159,232,255,.5)'; g.fillRect(cx,c.y-6,Math.round(24*hpr),2);
  }
  bossFrame(g,'THAW','#cfe9ff',
    boss.pods.reduce((a,o)=>a+Math.max(0,o.hp)+Math.max(0,o.ice),0)+Math.max(0,c.hp), 96);
}
function drawPress(g){
  for(const pod of boss.pods){
    if(pod.dead){ podWreck(g,pod,'#ffb02e'); continue; }
    podShell(g,pod,'#5a5142','#7d7256');
  }
  const c=boss.core, cx=c.x-cam.x, pulse=0.5+0.5*Math.sin(frame*0.18);
  /* the ram column above the head */
  g.fillStyle='#2a3038'; g.fillRect(cx+8,0,10,c.y);
  g.fillStyle='#48525f'; g.fillRect(cx+8,0,3,c.y);
  g.fillStyle=c.flash>0?'#ffdcd0':(boss.up?'#6a5a3a':'#3c3a34'); g.fillRect(cx-4,c.y-4,34,34);
  g.fillStyle='#9a8a63'; g.fillRect(cx-4,c.y-4,34,3);
  g.fillStyle='#14171c'; g.fillRect(cx,c.y,26,26);
  if(boss.up){
    g.beginPath(); g.fillStyle=`rgba(255,${170+40*pulse|0},70,${0.35+0.25*pulse})`; g.arc(cx+13,c.y+13,12,0,TAU); g.fill();
    g.beginPath(); g.fillStyle=`rgba(255,232,170,${0.7+0.3*pulse})`; g.arc(cx+13,c.y+13,6,0,TAU); g.fill();
  } else {
    for(let i=0;i<3;i++){ g.fillStyle='#4d5561'; g.fillRect(cx+2,c.y+4+i*8,22,4); }
    g.fillStyle='rgba(255,120,60,.25)'; g.fillRect(cx-6,c.y+28,38,4);
  }
  bossFrame(g,'PRESS','#ffb02e',
    boss.pods.reduce((a,o)=>a+Math.max(0,o.hp),0)+Math.max(0,c.hp), 66);
}
function drawReactor(g){
  for(const pod of boss.pods){
    if(pod.dead){ podWreck(g,pod,'#ff7a2f'); continue; }
    podShell(g,pod,'#5b3a30','#7d4f3e');
  }
  const c=boss.core, cx=c.x-cam.x, open=coreOpen(), pulse=0.5+0.5*Math.sin(frame*0.2);
  g.fillStyle=c.flash>0?'#ffdcd0':'#38221d'; g.fillRect(cx-4,c.y-4,38,38);
  g.fillStyle='#8a5a44'; g.fillRect(cx-4,c.y-4,38,3);
  g.fillStyle='#100807'; g.fillRect(cx,c.y,30,30);
  const hpr=clamp(c.hp/46,0,1);
  g.beginPath(); g.fillStyle=`rgba(255,${120+90*hpr|0},50,${0.35+0.3*pulse})`; g.arc(cx+15,c.y+15,13,0,TAU); g.fill();
  g.beginPath(); g.fillStyle=`rgba(255,224,150,${0.7+0.3*pulse})`; g.arc(cx+15,c.y+15,6,0,TAU); g.fill();
  /* the rotating shutter: four plates with one gap */
  g.save(); g.translate(cx+15,c.y+15); g.rotate(boss.shut);
  for(let i=0;i<4;i++){
    if(i===0) continue;                      /* the gap */
    g.rotate(TAU/4);
    g.fillStyle= open?'#5d4038':'#8a6a52';
    g.fillRect(-4,-17,8,11);
    g.fillStyle='#2a1a14'; g.fillRect(-4,-17,8,2);
  }
  g.restore();
  g.strokeStyle= open?'rgba(255,214,120,.75)':'rgba(120,90,70,.5)';
  g.lineWidth=1; g.beginPath(); g.arc(cx+15,c.y+15,17,0,TAU); g.stroke();
  bossFrame(g,'REACTOR','#ff7a2f',
    boss.pods.reduce((a,o)=>a+Math.max(0,o.hp),0)+Math.max(0,c.hp), 78);
}

function drawSluice(g){
  const bx=boss.x-cam.x, alive=boss.pods.filter(gt=>!gt.dead).length;
  /* dam buttress the gates are set into */
  g.fillStyle='#25333c'; g.fillRect(bx-16,8,20,164);
  g.fillStyle='#37505c'; g.fillRect(bx-16,8,20,3);
  g.fillStyle='#131c22'; g.fillRect(bx-16,169,20,3);

  for(const gt of boss.pods){
    const px=gt.x-cam.x, py=gt.y;
    if(gt.dead){
      g.fillStyle='#0d161b'; g.fillRect(px,py,28,26);
      /* a broken gate pours freely */
      for(let k=0;k<5;k++){
        const yy=py+18+((frame*3.6+k*23)%(H-py-18));
        g.fillStyle='rgba(214,244,250,.30)'; g.fillRect(px+5+k*4, yy|0, 1, 7);
      }
      if(frame%9<4){ g.fillStyle='#7fe3ff'; g.fillRect(px+7+rndi(0,12),py+6+rndi(0,10),3,3); }
      continue;
    }
    const wf=gt.flash>0, open=!gt.shut;
    g.fillStyle=wf?'#ffdcd0':(open?'#2a3d47':'#55636e'); g.fillRect(px,py,28,26);
    g.fillStyle=wf?'#ffdcd0':(open?'#3d5866':'#74838f'); g.fillRect(px+1,py+1,26,2);
    g.fillStyle='#121a20'; g.fillRect(px+1,py+23,26,2);
    if(open){
      /* the sluice is up: dark mouth, water pouring, and it can be hurt */
      g.fillStyle='#08121a'; g.fillRect(px+3,py+5,22,18);
      for(let k=0;k<6;k++){
        const yy=py+8+((frame*4.2+k*19)%(H-py-8));
        g.fillStyle= k%2?'rgba(236,252,255,.34)':'rgba(159,232,255,.26)';
        g.fillRect(px+4+k*4, yy|0, 1, 8);
      }
      g.fillStyle='rgba(127,227,255,.5)'; g.fillRect(px,py-2,28,2);
    } else {
      /* shut: armour plate with rivets, shots spark off it */
      for(let i=0;i<8;i++) g.fillStyle='#8a97a4', g.fillRect(px+3+(i%4)*7, py+4+((i/4)|0)*16, 2,2);
      g.fillStyle='#39454f'; g.fillRect(px+3,py+11,22,3);
    }
  }
  /* outflow core at the base — sealed until every gate is gone */
  const c=boss.core, cx=c.x-cam.x, sealed=alive>0, pulse=0.5+0.5*Math.sin(frame*0.14);
  g.fillStyle=c.flash>0?'#ffdcd0':'#2b3a44'; g.fillRect(cx-3,c.y-3,32,32);
  g.fillStyle='#7f909e'; g.fillRect(cx-3,c.y-3,32,2);
  if(sealed){
    g.fillStyle='#1a252c'; g.fillRect(cx,c.y,26,26);
    for(let i=0;i<3;i++){ g.fillStyle='#4a5a66'; g.fillRect(cx+2,c.y+4+i*8,22,4); }
    g.fillStyle='rgba(159,232,255,.20)'; g.fillRect(cx+2,c.y+2,22,1);
  } else {
    g.fillStyle='#08121a'; g.fillRect(cx,c.y,26,26);
    const hpr=clamp(c.hp/34,0,1), b0=Math.round(120+120*hpr);
    g.beginPath(); g.fillStyle=`rgba(90,${b0},255,${0.30+0.22*pulse})`; g.arc(cx+13,c.y+13,12,0,TAU); g.fill();
    g.beginPath(); g.fillStyle=`rgba(140,${b0},255,${0.72+0.28*pulse})`; g.arc(cx+13,c.y+13,8,0,TAU); g.fill();
    g.beginPath(); g.fillStyle=`rgba(236,252,255,${0.55+0.45*pulse})`; g.arc(cx+13,c.y+13,3.6,0,TAU); g.fill();
  }

  /* the flood */
  if(boss.flood < H){
    const fy=Math.round(boss.flood);
    g.fillStyle='rgba(20,80,96,.55)'; g.fillRect(0,fy,W,H-fy);
    g.fillStyle='rgba(159,232,255,.30)'; g.fillRect(0,fy,W,1);
    for(let i=0;i<W;i+=7){
      const yy=fy+Math.sin((i+frame*2.2)*0.09)*1.5;
      g.fillStyle='rgba(214,244,250,.22)'; g.fillRect(i,Math.round(yy),4,1);
    }
  }

  if(!boss.dying){
    const total=boss.pods.reduce((a,gt)=>a+Math.max(0,gt.hp),0)+Math.max(0,c.hp);
    const frac=clamp(total/70,0,1);
    g.fillStyle='rgba(6,8,12,.72)'; g.fillRect(W-132,14,128,9);
    drawText(g,'SLUICE',W-129,16,'#9fe8ff',1);
    g.fillStyle='#14323a'; g.fillRect(W-90,17,84,3);
    g.fillStyle= frac>0.5?'#7fe3ff': frac>0.22?'#ffb02e':'#ff2f4d';
    g.fillRect(W-90,17,Math.round(84*frac),3);
    g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(W-90,17,Math.round(84*frac),1);
  }
}
function drawBoss(g){
  if(!boss) return;
  if(boss.kind==='sluice')  return drawSluice(g);
  if(boss.kind==='thaw')    return drawThaw(g);
  if(boss.kind==='press')   return drawPress(g);
  if(boss.kind==='reactor') return drawReactor(g);
  const bx=boss.x-cam.x;
  /* mounting spine bolted to the gate face */
  g.fillStyle='#2a2f38'; g.fillRect(bx-8,20,12,140);
  g.fillStyle='#3d444f'; g.fillRect(bx-8,20,12,3);
  g.fillStyle='#171b20'; g.fillRect(bx-8,157,12,3);
  for(let i=26;i<156;i+=13){ g.fillStyle='#5b6470'; g.fillRect(bx-6,i,3,3); g.fillRect(bx,i,3,3); }
  for(const pod of boss.pods){
    const px=pod.x-cam.x, py=pod.y;
    if(pod.dead){
      g.fillStyle='#161a1f'; g.fillRect(px,py,26,26);
      g.fillStyle='#0a0c0f'; g.fillRect(px+4,py+4,18,18);
      if(frame%9<4){ g.fillStyle='#ff7a2f'; g.fillRect(px+6+rndi(0,10),py+6+rndi(0,10),3,3); }
      continue;
    }
    const wf=pod.flash>0;
    g.fillStyle=wf?'#ffdcd0':'#4d5561'; g.fillRect(px,py,26,26);
    g.fillStyle=wf?'#ffdcd0':'#69737f'; g.fillRect(px+1,py+1,24,2);
    g.fillStyle='#22262c'; g.fillRect(px+1,py+23,24,2);
    g.beginPath(); g.fillStyle=wf?'#ffdcd0':'#333a44'; g.arc(px+13,py+13,10,0,TAU); g.fill();
    /* barrel over the housing so the aim is legible */
    g.save(); g.translate(px+13,py+13); g.rotate(pod.ang);
    g.fillStyle=wf?'#ffdcd0':'#39404a'; g.fillRect(0,-4,18,8);
    g.fillStyle=wf?'#ffdcd0':'#7e8998'; g.fillRect(2,-3,15,2);
    g.fillStyle='#14171c'; g.fillRect(15,-3,4,6); g.restore();
    g.beginPath(); g.fillStyle=(pod.fireT<24)?'#ff4d4d':'#7d2b2b'; g.arc(px+13,py+13,4,0,TAU); g.fill();
    if(pod.fireT<24){ g.beginPath(); g.fillStyle='rgba(255,77,77,.28)'; g.arc(px+13,py+13,8,0,TAU); g.fill(); }
    for(let i=0;i<4;i++){ g.fillStyle='#828d9b'; g.fillRect(px+2+ (i%2)*21, py+3+((i/2)|0)*19, 2,2); }
  }
  const c=boss.core, cx=c.x-cam.x;
  const wf=c.flash>0, pulse=0.5+0.5*Math.sin(frame*0.14);
  /* core: an armoured lens set into the gate */
  g.fillStyle=wf?'#ffdcd0':'#2c323b'; g.fillRect(cx-3,c.y-3,28,28);
  g.fillStyle='#8a96a5'; g.fillRect(cx-3,c.y-3,28,2); g.fillRect(cx-3,c.y+23,28,2);
  for(let i=0;i<4;i++){ g.fillStyle='#5b6470'; g.fillRect(cx-2+(i%2)*25, c.y-2+((i/2)|0)*24, 3,3); }
  g.fillStyle='#12161b'; g.fillRect(cx,c.y,22,22);
  const hpr=clamp(c.hp/44,0,1);
  const r0=Math.round(90+110*hpr);
  g.beginPath(); g.fillStyle=`rgba(255,${r0},60,${0.30+0.22*pulse})`; g.arc(cx+11,c.y+11,11,0,TAU); g.fill();
  g.beginPath(); g.fillStyle=`rgba(255,${r0},70,${0.72+0.28*pulse})`; g.arc(cx+11,c.y+11,7.5,0,TAU); g.fill();
  g.beginPath(); g.fillStyle=`rgba(255,246,214,${0.55+0.45*pulse})`; g.arc(cx+11,c.y+11,3.4,0,TAU); g.fill();
  g.fillStyle='rgba(10,12,16,.65)';
  for(let i=0;i<3;i++) g.fillRect(cx+1, c.y+5+i*6, 20,1);
  /* boss hp bar — sits under the HUD strip, clear of the weapon readout */
  if(!boss.dying){
    const total=boss.pods.reduce((a,p)=>a+Math.max(0,p.hp),0)+Math.max(0,c.hp);
    const frac=clamp(total/76,0,1);
    g.fillStyle='rgba(6,8,12,.72)'; g.fillRect(W-132,14,128,9);
    drawText(g,'GATE',W-129,16,'#ff8a8a',1);
    g.fillStyle='#3a1418'; g.fillRect(W-102,17,96,3);
    g.fillStyle= frac>0.5?'#ff5c3a': frac>0.22?'#ffb02e':'#ff2f4d';
    g.fillRect(W-102,17,Math.round(96*frac),3);
    g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(W-102,17,Math.round(96*frac),1);
  }
}
function drawParts(g){
  for(const p of parts){
    const sx=Math.round(p.x-cam.x), sy=Math.round(p.y);
    if(p.ring){
      const a=1-p.t/p.life;
      g.strokeStyle=`rgba(255,220,150,${a*0.8})`; g.lineWidth=1;
      g.beginPath(); g.arc(sx,sy,p.r,0,TAU); g.stroke();
      g.strokeStyle=`rgba(255,120,50,${a*0.5})`; g.beginPath(); g.arc(sx,sy,p.r*0.6,0,TAU); g.stroke();
    } else if(p.smoke){
      const a=(1-p.t/p.life)*0.30;
      g.fillStyle=`rgba(90,90,100,${a})`; g.beginPath(); g.arc(sx,sy,p.r,0,TAU); g.fill();
    } else if(p.flash){
      g.save(); g.translate(sx,sy); g.rotate(p.a);
      const a=1-p.t/p.life;
      g.fillStyle=`rgba(255,246,194,${a})`; g.fillRect(0,-2,7,4); g.fillRect(3,-4,3,8);
      g.restore();
    } else {
      const a=1-p.t/p.life;
      g.globalAlpha=clamp(a*1.4,0,1); g.fillStyle=p.col;
      g.fillRect(sx,sy,p.sz,p.sz); g.globalAlpha=1;
    }
  }
}
function drawBullets(g){
  for(const b of bullets){
    const sx=Math.round(b.x-cam.x), sy=Math.round(b.y);
    if(b.kind==='L'){
      g.save(); g.translate(sx+1,sy+1); g.rotate(Math.atan2(b.vy,b.vx));
      g.fillStyle='rgba(139,233,255,.35)'; g.fillRect(-14,-2,28,4);
      g.fillStyle='#8be9ff'; g.fillRect(-10,-1,20,2);
      g.fillStyle='#ffffff'; g.fillRect(-4,-1,10,1); g.restore();
    } else if(b.kind==='F'){
      g.fillStyle='rgba(255,107,61,.35)'; g.fillRect(sx-2,sy-2,7,7);
      g.fillStyle='#ff9c3f'; g.fillRect(sx-1,sy-1,5,5);
      g.fillStyle='#fff3c4'; g.fillRect(sx,sy,3,3);
    } else {
      g.fillStyle='rgba(255,255,200,.25)'; g.fillRect(sx-1,sy-1,5,5);
      g.fillStyle=b.col; g.fillRect(sx,sy,3,3);
      g.fillStyle='#fff'; g.fillRect(sx+1,sy+1,1,1);
    }
  }
  for(const b of ebullets){
    const sx=Math.round(b.x-cam.x), sy=Math.round(b.y);
    g.fillStyle='rgba(255,120,60,.22)'; g.fillRect(sx-2,sy-2,b.w+4,b.h+4);
    g.fillStyle=b.col; g.fillRect(sx,sy,b.w,b.h);
    g.fillStyle='#fff8e0'; g.fillRect(sx+1,sy+1,b.w-2,b.h-2);
  }
}
function drawHUD(g){
  /* top bar */
  g.fillStyle='rgba(6,8,12,.55)'; g.fillRect(0,0,W,11);
  g.fillStyle='rgba(230,57,70,.55)'; g.fillRect(0,11,W,1);
  drawText(g,'1UP',4,2,'#e63946',1);
  drawText(g,String(score).padStart(6,'0'),22,2,'#ffe27a',1);
  /* lives */
  const shown=Math.min(lives,6);
  for(let i=0;i<shown;i++) blit(g,SPR.head, 92+i*9, 1, false);
  if(lives>6) drawText(g,'X'+lives, 92+7*9, 2,'#fff',1);
  /* shield pips, with the out-of-combat recharge running underneath them */
  if(player){
    for(let i=0;i<SHIELD_MAX;i++){
      const x=160+i*8;
      g.fillStyle = i<player.shield ? '#7fe3ff' : 'rgba(127,227,255,.16)';
      g.fillRect(x,3,6,5);
    }
    if(player.shield<SHIELD_MAX){
      const bw=SHIELD_MAX*8-2, pr=clamp(player.regenT/SHIELD_REGEN,0,1);
      g.fillStyle='rgba(127,227,255,.22)'; g.fillRect(160,9,bw,1);
      g.fillStyle='#7fe3ff'; g.fillRect(160,9,Math.round(bw*pr),1);
    }
  }
  /* weapon */
  const w=WEAPONS[weapon];
  g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(W-96,1,44,9);
  g.strokeStyle='#4b5462'; g.lineWidth=1; g.strokeRect(W-96.5,1.5,44,8);
  drawText(g,w.name.slice(0,7),W-93,2,w.col,1);
  if(player&&player.barrier>0) drawText(g,'BAR',W-50,2,'#c9a8ff',1);
  /* progress */
  const pr=clamp(cam.x/(LVL_W-W),0,1);
  g.fillStyle='rgba(255,255,255,.10)'; g.fillRect(4,H-4,W-8,2);
  g.fillStyle='#e63946'; g.fillRect(4,H-4,Math.round((W-8)*pr),2);
  g.fillStyle='#ffe27a'; g.fillRect(4+Math.round((W-8)*pr)-1,H-5,2,4);
}

/* -------------------------------------------------------------- title art */
let titleT=0;
const TITLE='IRONVINE';
function drawTitle(g){
  titleT++;
  drawParallax(g);
  g.drawImage(groundCv, 0, 0, W, H, 0, 0, W, H);
  g.fillStyle='rgba(4,6,12,.55)'; g.fillRect(0,0,W,H);
  /* logo */
  const cx=W/2, y=44+Math.sin(titleT*0.03)*2;
  for(let i=6;i>0;i--){
    drawTextC(g,TITLE,cx,y+i, `rgba(${20+i*6},${8+i*3},${16+i*4},1)`,5);
  }
  /* red -> gold, going the short way round the wheel (352 -> 390 == 30) */
  const grad=(t)=>`hsl(${lerp(352,392,t)%360},${lerp(82,94,t)}%,${lerp(48,60,t)}%)`;
  /* draw logo scanline-gradient by clipping */
  const logoY=Math.round(y), sc=TITLE.length>6?4:5;
  for(let r=0;r<7;r++){
    const s=TITLE; const x0=Math.round(cx-textW(s,sc)/2);
    g.fillStyle=grad(r/6);
    for(let i=0;i<s.length;i++){ const gl=GLYPH[s[i]];
      for(let c=0;c<5;c++) if(gl[r][c]==='1') g.fillRect(x0+i*6*sc+c*sc, logoY+r*sc, sc, sc); }
  }
  /* silver shine sweep */
  const sweep=((titleT*2)%260)-40;
  g.save(); g.globalCompositeOperation='lighter';
  for(let r=0;r<7;r++){ const s=TITLE, x0=Math.round(cx-textW(s,sc)/2);
    for(let i=0;i<s.length;i++){ const gl=GLYPH[s[i]];
      for(let c=0;c<5;c++) if(gl[r][c]==='1'){
        const px=x0+i*6*sc+c*sc, d=Math.abs(px-(cx-110+sweep));
        if(d<16){ g.fillStyle=`rgba(255,255,255,${(1-d/16)*0.55})`; g.fillRect(px,logoY+r*sc,sc,sc); } } } }
  g.restore();
  drawTextC(g,'STAGE '+stage+'  -  '+STAGE_NAMES[stage],cx,86,'#9fb4c8',1);
  if(best.score>0) drawTextC(g,'BEST  '+String(best.score).padStart(6,'0')+
    '   REACHED STAGE '+best.stage,cx,98,'#6d7a8c',1);
  drawTextC(g,isTouch?'':'O  -  OPTIONS',cx,H-42,'#4e5a6b',1);
  g.fillStyle='#e63946'; g.fillRect(cx-70,96,140,1);

  if((titleT>>4)%2===0) drawTextCSh(g,isTouch?'TAP TO START':'PRESS ENTER',cx,112,'#ffe27a','#3a1a10',2);
  drawTextC(g,isTouch?'FIRE    JUMP    STICK AIMS 8 WAYS':'Z FIRE    X JUMP    ARROWS AIM',cx,136,'#6c7b8e',1);
  drawTextC(g,isTouch?'HOLD DOWN + JUMP TO DROP THROUGH LEDGES':'HOLD DOWN + X TO DROP THROUGH LEDGES',cx,147,'#4e5a6b',1);
  if(konamiOn) drawTextC(g,'* 30 LIVES ACTIVATED *',cx,162,(titleT>>3)%2?'#ffd23f':'#ff6b3d',1);
  else drawTextC(g,'...UP UP DOWN DOWN...',cx,162,'#39424f',1);
  g.fillStyle='rgba(4,6,12,.72)'; g.fillRect(0,H-20,W,20);
  drawTextC(g,'AN HTML5 HOMAGE  -  NOT AFFILIATED WITH KONAMI',cx,H-13,'#3f4956',1);
}

/* ------------------------------------------------------------------- loop */
function update(){
  frame++;
  Audio_.tick();
  updateLights();
  if(hitstop>0){ hitstop--; return; }
  if(state==='PLAY'){
    stageTime++;
    updatePlayer();
    if(!player.walkOut){
      updateEnemies(); updateBullets(); updatePickups();
      if(bossActive) updateBoss();
      /* enemy body contact */
      if(!player.dead && player.inv<=0){
        for(const e of enemies){
          if(e.type==='bunker'||e.type==='mortar'||e.type==='turret') continue;
          if(aabb({x:e.x,y:e.y,w:e.w,h:e.h},hb(player))) { killPlayer(); break; }
        }
      }
      updateCamera();
    } else { updateParts(); }
  } else if(state==='CLEAR'){
    stateT++; updatePlayer(); updateParts();
    if(stateT%22===0) explode(cam.x+rnd(W,20), rnd(120,20), stateT%44===0);
  } else if(state==='GAMEOVER'){ stateT++; updateParts(); }
  updateParts();
  if(shake>0) shake*=0.86;
}
function render(){
  const g=ctx;
  g.save();
  const sh = shake>0.2 ? shake : 0;
  if(sh) g.translate(Math.round(rnd(sh,-sh)), Math.round(rnd(sh,-sh)));

  if(state==='TITLE'){ drawTitle(g); drawMotes(g); grade(g); g.restore(); postFX(g); return; }

  drawParallax(g);
  /* terrain slice, then animated water inside the chasms */
  const cx=Math.round(cam.x);
  g.drawImage(groundCv, cx, 0, W, H, 0, 0, W, H);
  drawWater(g);
  if(currents.length) drawCurrents(g);
  if(presses.length) drawPresses(g);
  if(vents.length) drawVents(g);
  drawMotes(g);

  for(const f of pickups){ if(f.type==='falcon') drawFalcon(g,f); else drawItem(g,f); }
  for(const e of enemies) drawEnemy(g,e);
  if(boss) drawBoss(g);
  drawParts(g);
  if(player) drawPlayer(g);
  drawBullets(g);
  /* foreground foliage */
  g.globalAlpha=0.92; g.drawImage(fgCv, cx, 0, W, H, 0, 0, W, H); g.globalAlpha=1;
  drawLights(g);
  grade(g);

  for(const f of floats){
    const a=1-f.t/f.life;
    g.globalAlpha=clamp(a*1.6,0,1);
    if(f.big) drawTextCSh(g,f.s,f.x-cam.x,f.y,f.col,'#20101a',2);
    else drawTextSh(g,f.s,Math.round(f.x-cam.x),Math.round(f.y),f.col,'#20101a',1);
    g.globalAlpha=1;
  }
  drawHUD(g);
  g.restore();

  if(state==='CLEAR'){
    g.fillStyle=`rgba(4,6,12,${clamp(stateT/120,0,.72)})`; g.fillRect(0,0,W,H);
    if(stateT>40){
      drawTextCSh(g,'STAGE '+stage+' CLEAR',W/2,70,'#ffe27a','#5a1f14',3);
      drawTextC(g,'SCORE  '+String(score).padStart(6,'0'),W/2,104,'#9fe8ff',1);
      drawTextC(g,'TIME   '+String(Math.floor(stageTime/60)).padStart(3,'0')+' SEC',W/2,118,'#9fe8ff',1);
      if(stateT>110 && (stateT>>4)%2===0) drawTextCSh(g,isTouch?'TAP TO GO ON':'PRESS ENTER',W/2,142,'#ffffff','#2a1a12',2);
      drawTextC(g, stage<STAGE_COUNT ? 'NEXT: '+STAGE_NAMES[stage+1] : 'TO BE CONTINUED',
        W/2,H-30,'#6d7a8c',1);
    }
  }
  if(state==='GAMEOVER'){
    g.fillStyle=`rgba(6,2,4,${clamp(stateT/70,0,.80)})`; g.fillRect(0,0,W,H);
    if(stateT>25){
      drawTextCSh(g,'GAME OVER',W/2,58,'#e63946','#2a0a0e',3);
      drawTextC(g,'SCORE  '+String(score).padStart(6,'0'),W/2,88,'#c8d3e0',1);
      drawTextC(g,'BEST   '+String(best.score).padStart(6,'0'),W/2,100,'#6d7a8c',1);
      if(stateT>75) for(let i=0;i<GO_ITEMS.length;i++){
        const on=i===goSel, y=122+i*15;
        if(on){ g.fillStyle='rgba(255,226,122,.13)'; g.fillRect(W/2-84,y-3,168,13); }
        drawTextC(g,(on?'> ':'  ')+GO_ITEMS[i],W/2,y,on?'#ffe27a':'#8a97a8',1);
      }
    }
  }
  postFX(g);
}
function postFX(g){
  if(paused && !optionsOpen) drawPause(g);
  if(optionsOpen) drawOptions(g);
  if(fade>0){ g.fillStyle=`rgba(0,0,0,${clamp(fade,0,1)})`; g.fillRect(0,0,W,H); }
}

let acc=0,last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=now-last; last=now; if(dt>200) dt=200;
  acc+=dt;
  const STEP=1000/60;
  let guard=0;
  pollPad();
  if(paused){ acc=0; render(); return; }
  while(acc>=STEP && guard<4){ acc-=STEP; update(); clearPressed(); guard++; }
  if(guard===4) acc=0;
  render();
}
function clearPressed(){ for(const k in pressed) pressed[k]=false; }

/* -------------------------------------------------------------- state mgr */
function doStart(){
  Audio_.init(); Audio_.resume();
  if(state==='TITLE'){ resetRun(); state='PLAY'; Audio_.coin(); }
  else if(state==='CLEAR'&&stateT>110){
    if(stage<STAGE_COUNT) nextStage(); else { stage=1; state='TITLE'; titleT=0; }
  }
  else if(state==='GAMEOVER'&&stateT>75){ state='TITLE'; titleT=0; }
}
addEventListener('keydown',e=>{
  if(e.repeat) return;
  const c=codeOf(e);
  /* a rebind swallows the very next key, so this must come first */
  if(rebindFor){ e.preventDefault(); optCaptureKey(c); return; }
  if(optionsOpen){
    e.preventDefault();
    const N=OPT_ROWS.length;
    if(c==='Escape')                 closeOptions();
    else if(c==='ArrowUp'||c==='KeyW')    optSel=(optSel+N-1)%N;
    else if(c==='ArrowDown'||c==='KeyS')  optSel=(optSel+1)%N;
    else if(c==='ArrowLeft'||c==='KeyA')  optAdjust(-1);
    else if(c==='ArrowRight'||c==='KeyD') optAdjust(1);
    else if(c==='Enter'||c==='Space'||c==='KeyZ') optChoose();
    return;
  }
  if(c==='Escape'){ e.preventDefault(); togglePause(); return; }
  if(c==='KeyF'){ e.preventDefault(); toggleFullscreen(); return; }
  if(paused){
    e.preventDefault();
    if(c==='ArrowUp'||c==='KeyW')   pauseSel=(pauseSel+PAUSE_ITEMS.length-1)%PAUSE_ITEMS.length;
    if(c==='ArrowDown'||c==='KeyS') pauseSel=(pauseSel+1)%PAUSE_ITEMS.length;
    if(c==='Enter'||c==='Space'||c==='KeyZ') pauseChoose();
    return;
  }
  if(state==='GAMEOVER' && stateT>75){
    if(c==='ArrowUp'||c==='KeyW')   { goSel=(goSel+GO_ITEMS.length-1)%GO_ITEMS.length; return; }
    if(c==='ArrowDown'||c==='KeyS') { goSel=(goSel+1)%GO_ITEMS.length; return; }
    if(c==='Enter'||c==='Space'||c==='KeyZ'){ e.preventDefault(); goChoose(); return; }
  }
  if(state==='TITLE' && c==='KeyO'){ e.preventDefault(); openOptions('title'); return; }
  if(actionFor(e)!=='start') return;
  doStart();
});

/* ------------------------------------------------------------ touch input */
/* the on-screen pad feeds the same keys/pressed maps the keyboard does, so the
   game logic below is untouched. multi-touch is tracked per identifier, which is
   what lets you hold a direction and fire/jump at the same time (and down+jump
   to drop through a ledge). */
/* Touch capability alone is not enough: most Windows laptops report maxTouchPoints>0
   while being driven with a mouse. Only treat it as a touch device when the PRIMARY
   pointer is coarse (phone/tablet), or when there is no fine pointer anywhere. */
const mq = q => !!(window.matchMedia && matchMedia(q).matches);
const canTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
const isTouch = canTouch && (mq('(pointer:coarse)') || !mq('(any-pointer:fine)'));
document.body.className = isTouch ? 'touch' : 'no-touch';
if(isTouch){
  const zone=document.getElementById('stickZone'), stick=document.getElementById('stick'),
        nub=document.getElementById('nub'), DIRS=['l','r','u','d'],
        DEAD=18, HYST=8;
  /* Eight sectors as [centre deg, half-width deg, keys], y down so 90 = down.
     Widths are deliberately uneven: running left/right is the common case and gets
     the widest sectors, the 45 aim stays generous, straight up/down are narrower
     but still comfortably reachable. Widths tile 360 exactly. */
  const SEC=[[0,30,['r']], [49,19,['r','d']], [90,22,['d']], [131,19,['l','d']],
             [180,30,['l']], [229,19,['l','u']], [270,22,['u']], [311,19,['r','u']]];
  let stickId=null, ox=0, oy=0, sec=-1;
  const clearDirs=()=>{ for(const d of DIRS) keys[d]=false; };
  const angDiff=(a,b)=>{ let d=(a-b)%360; if(d>180)d-=360; if(d<-180)d+=360; return d; };
  /* hysteresis: hold the current sector until the thumb is HYST degrees past its
     edge, so a tremor near a boundary can't strobe between two directions */
  function sectorFor(deg){
    if(sec>=0 && Math.abs(angDiff(deg,SEC[sec][0]))<=SEC[sec][1]+HYST) return sec;
    for(let i=0;i<8;i++) if(Math.abs(angDiff(deg,SEC[i][0]))<=SEC[i][1]) return i;
    return sec;
  }
  const ringTo=(x,y)=>{ stick.style.left=(x-RING)+'px'; stick.style.top=(y-RING)+'px'; };
  function ringHome(){
    const z=zone.getBoundingClientRect();
    ringTo(z.left+RING+14, z.bottom-RING-14);
  }
  function aim(dx,dy){
    clearDirs();
    const m=Math.hypot(dx,dy);
    if(m<DEAD){ sec=-1; nub.style.transform='translate(0,0)'; return; }
    sec=sectorFor((Math.atan2(dy,dx)*180/Math.PI+360)%360);
    if(sec>=0) for(const d of SEC[sec][2]){ keys[d]=true; pressed[d]=true; }
    const k=Math.min(1,m/44)*40/m;
    nub.style.transform='translate('+(dx*k).toFixed(1)+'px,'+(dy*k).toFixed(1)+'px)';
  }
  zone.addEventListener('touchstart',e=>{
    e.preventDefault(); if(state!=='PLAY') doStart();
    const t=e.changedTouches[0];
    /* floating origin: the stick centres on wherever the thumb landed, so landing
       is neutral — no direction until you actually move */
    stickId=t.identifier; ox=t.clientX; oy=t.clientY; sec=-1;
    ringTo(ox,oy); stick.classList.add('live');
    clearDirs(); nub.style.transform='translate(0,0)';
  },{passive:false});
  zone.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches) if(t.identifier===stickId) aim(t.clientX-ox,t.clientY-oy);
  },{passive:false});
  const dropStick=e=>{
    e.preventDefault();
    for(const t of e.changedTouches) if(t.identifier===stickId){
      stickId=null; sec=-1; clearDirs();
      nub.style.transform='translate(0,0)'; stick.classList.remove('live'); ringHome(); }
  };
  zone.addEventListener('touchend',dropStick,{passive:false});
  zone.addEventListener('touchcancel',dropStick,{passive:false});
  ringHome(); addEventListener('resize',ringHome);

  function button(id,act){
    const el=document.getElementById(id); let id_=null;
    el.addEventListener('touchstart',e=>{
      e.preventDefault(); if(state!=='PLAY') doStart();
      id_=e.changedTouches[0].identifier; el.classList.add('on');
      if(act==='mute'){ Audio_.init(); Audio_.muted=!Audio_.muted;
        if(Audio_.master) Audio_.master.gain.value=Audio_.muted?0:0.5;
        el.textContent=Audio_.muted?'MUTE':'VOL'; }
      else { keys[act]=true; pressed[act]=true; }
    },{passive:false});
    const up=e=>{
      e.preventDefault();
      for(const t of e.changedTouches) if(t.identifier===id_){
        id_=null; el.classList.remove('on'); if(act!=='mute') keys[act]=false; }
    };
    el.addEventListener('touchend',up,{passive:false});
    el.addEventListener('touchcancel',up,{passive:false});
  }
  button('bFire','fire'); button('bJump','jump'); button('bMute','mute');
  document.getElementById('bPause').addEventListener('touchstart',e=>{
    e.preventDefault(); togglePause(); },{passive:false});
  /* tap the playfield to start / advance between screens */
  cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(paused){                                  /* pick the menu row under the thumb */
      const r=cv.getBoundingClientRect(), t=e.changedTouches[0];
      const i=Math.round(((t.clientY-r.top)/(r.height/H)-86)/16);
      if(i>=0&&i<PAUSE_ITEMS.length){ pauseSel=i; pauseChoose(); }
      return;
    }
    if(state!=='PLAY') doStart();
  },{passive:false});
  /* suppress pinch-zoom and double-tap zoom, which otherwise fight the canvas */
  for(const g of ['gesturestart','gesturechange','gestureend'])
    addEventListener(g,e=>e.preventDefault(),{passive:false});
  let lastTap=0;
  addEventListener('touchend',e=>{ const n=Date.now(); if(n-lastTap<300) e.preventDefault(); lastTap=n; },{passive:false});
  addEventListener('contextmenu',e=>e.preventDefault());
}


/* ---------------------------------------------------------------- gamepad */
/* Standard-mapping pad, which is what XInput and the Steam Deck both present.
   State is written on EDGES only, so a pad and the keyboard can be used in the
   same session without one clobbering the other every poll. */
const PAD_DZ=0.42;
let padPrev={}, padWasStart=false, padIndex=null,
    padNav={u:false,d:false,a:false,l:false,r:false,b:false};
addEventListener('gamepadconnected',e=>{ padIndex=e.gamepad.index; });
addEventListener('gamepaddisconnected',()=>{ padIndex=null; padPrev={}; });
function activePad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  if(padIndex!=null && pads[padIndex] && pads[padIndex].connected) return pads[padIndex];
  for(const g of pads) if(g && g.connected) return g;
  return null;
}
function setPad(k,v){
  if(padPrev[k]===v) return;
  padPrev[k]=v; keys[k]=v; if(v) pressed[k]=true;
}
function pollPad(){
  const gp=activePad(); if(!gp) return;
  const B=i=>!!(gp.buttons[i] && gp.buttons[i].pressed);
  const ax=gp.axes[0]||0, ay=gp.axes[1]||0;
  setPad('l', B(14)||ax<-PAD_DZ);  setPad('r', B(15)||ax>PAD_DZ);
  setPad('u', B(12)||ay<-PAD_DZ);  setPad('d', B(13)||ay>PAD_DZ);
  setPad('fire', B(2)||B(5)||B(7));            /* X / RB / RT */
  setPad('jump', B(0)||B(4)||B(6));            /* A / LB / LT */
  const nu=B(12)||ay<-PAD_DZ, nd=B(13)||ay>PAD_DZ, na=B(0)||B(2);
  const nl=B(14)||ax<-PAD_DZ, nr=B(15)||ax>PAD_DZ, nb=B(1);
  if(optionsOpen){
    const N=OPT_ROWS.length;
    if(nb&&!padNav.b){ if(rebindFor) rebindFor=null; else closeOptions(); }
    else if(!rebindFor){
      if(nu&&!padNav.u) optSel=(optSel+N-1)%N;
      if(nd&&!padNav.d) optSel=(optSel+1)%N;
      if(nl&&!padNav.l) optAdjust(-1);
      if(nr&&!padNav.r) optAdjust(1);
      if(na&&!padNav.a) optChoose();
    }
  } else if(paused){
    if(nu&&!padNav.u) pauseSel=(pauseSel+PAUSE_ITEMS.length-1)%PAUSE_ITEMS.length;
    if(nd&&!padNav.d) pauseSel=(pauseSel+1)%PAUSE_ITEMS.length;
    if(na&&!padNav.a) pauseChoose();
  } else if(state==='GAMEOVER' && stateT>75){
    if(nu&&!padNav.u) goSel=(goSel+GO_ITEMS.length-1)%GO_ITEMS.length;
    if(nd&&!padNav.d) goSel=(goSel+1)%GO_ITEMS.length;
    if(na&&!padNav.a) goChoose();
  }
  padNav.l=nl; padNav.r=nr; padNav.b=nb;
  padNav={u:nu,d:nd,a:na};
  const st=B(9)||B(8);                          /* Start / Back */
  if(st && !padWasStart && !optionsOpen){
    if(state==='PLAY') togglePause();
    else if(state==='GAMEOVER' && stateT>75) goChoose();
    else doStart();
  }
  padWasStart=st;
}

/* ------------------------------------------------------ pause / fullscreen */
let paused=false, pauseSel=0;
const PAUSE_ITEMS=['RESUME','RESTART STAGE','OPTIONS','FULLSCREEN','QUIT TO TITLE'];
function togglePause(){
  if(state!=='PLAY') return;
  paused=!paused; pauseSel=0;
  if(!paused) clearPressed();
  Audio_.init();
  if(Audio_.ac){ if(paused) Audio_.ac.suspend(); else Audio_.ac.resume(); }
}
function toggleFullscreen(){
  const d=document;
  if(d.fullscreenElement || d.webkitFullscreenElement){
    (d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d);
  } else {
    const el=d.documentElement;
    (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
  }
}
function pauseChoose(){
  const it=PAUSE_ITEMS[pauseSel];
  if(it==='RESUME') togglePause();
  else if(it==='RESTART STAGE'){ paused=false; if(Audio_.ac) Audio_.ac.resume(); restartStage(); }
  else if(it==='OPTIONS') openOptions('pause');
  else if(it==='FULLSCREEN') toggleFullscreen();
  else if(it==='QUIT TO TITLE'){ paused=false; if(Audio_.ac) Audio_.ac.resume();
    stage=1; buildBackdrop(); buildLevel(); resetRun(); state='TITLE'; titleT=0; }
}
/* rebuild the current stage without touching score or lives */
function restartStage(){
  bullets=[];ebullets=[];enemies=[];pickups=[];parts=[];floats=[];lights=[];
  boss=null; bossActive=false; bossDeadT=0;
  cam={x:0,y:0,lock:false,max:0}; shake=0; stageTime=0;
  buildLevel();
  player=mkPlayer(40,GY-24); player.inv=140;
  state='PLAY'; stateT=0;
}
function drawPause(g){
  g.fillStyle='rgba(4,8,12,.74)'; g.fillRect(0,0,W,H);
  drawTextCSh(g,'PAUSED',W/2,44,'#ffe27a','#3a1a10',3);
  for(let i=0;i<PAUSE_ITEMS.length;i++){
    const on=i===pauseSel, y=86+i*16;
    if(on){ g.fillStyle='rgba(255,226,122,.13)'; g.fillRect(W/2-92,y-3,184,13); }
    drawTextC(g,(on?'> ':'  ')+PAUSE_ITEMS[i],W/2,y,on?'#ffe27a':'#8a97a8',1);
  }
  drawTextC(g,'STAGE '+stage+'   SCORE '+String(score).padStart(6,'0'),W/2,H-34,'#6d7a8c',1);
  drawTextC(g, isTouch?'TAP A LINE':'ARROWS + '+(activePad()?'A':'ENTER'), W/2,H-20,'#4e5a6b',1);
}


/* =============================================================== settings ==
   Everything the player can change, plus their best run, in one versioned
   localStorage record. Writes are wrapped because private-mode Safari throws on
   setItem, and a save failure must never take the game down. */
const SAVE_KEY='ironvine.v1';
const DEF_BINDS={ l:['ArrowLeft','KeyA'], r:['ArrowRight','KeyD'],
  u:['ArrowUp','KeyW'], d:['ArrowDown','KeyS'],
  fire:['KeyZ','KeyJ'], jump:['KeyX','KeyK','Space'],
  start:['Enter'], mute:['KeyM'] };
const settings={ master:0.5, music:0.30, sfx:0.55, muted:false, fullscreen:false,
                 binds:JSON.parse(JSON.stringify(DEF_BINDS)) };
const best={ score:0, stage:1 };
let continuesUsed=0;

function saveState(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({settings,best})); }catch(e){}
}
function loadState(){
  try{
    const j=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(!j) return;
    if(j.settings){
      for(const k of ['master','music','sfx']) if(typeof j.settings[k]==='number')
        settings[k]=clamp(j.settings[k],0,1);
      if(typeof j.settings.muted==='boolean') settings.muted=j.settings.muted;
      if(typeof j.settings.fullscreen==='boolean') settings.fullscreen=j.settings.fullscreen;
      if(j.settings.binds) for(const a in DEF_BINDS)
        if(Array.isArray(j.settings.binds[a]) && j.settings.binds[a].length)
          settings.binds[a]=j.settings.binds[a].slice(0,3);
    }
    if(j.best){ best.score=j.best.score|0; best.stage=Math.max(1,j.best.stage|0); }
  }catch(e){}
}
function applyVolumes(){
  Audio_.muted=settings.muted;
  if(!Audio_.master) return;
  Audio_.master.gain.value = settings.muted ? 0 : settings.master;
  Audio_.mus.gain.value = settings.music;
  Audio_.sfx.gain.value = settings.sfx;
}
function recordBest(){
  let dirty=false;
  if(score>best.score){ best.score=score; dirty=true; }
  if(stage>best.stage){ best.stage=stage; dirty=true; }
  if(dirty) saveState();
}

/* ================================================================ options ==
   One row list driven by the same nav as the pause menu. Sliders take left/right,
   binds capture the next key pressed. */
let optionsOpen=false, optSel=0, rebindFor=null, optFrom='title';
const OPT_ROWS=[
  {k:'master', label:'MASTER VOLUME', type:'slider'},
  {k:'music',  label:'MUSIC VOLUME',  type:'slider'},
  {k:'sfx',    label:'SFX VOLUME',    type:'slider'},
  {k:'muted',  label:'MUTE',          type:'toggle'},
  {k:'fullscreen', label:'FULLSCREEN', type:'fs'},
  {a:'l',    label:'LEFT',  type:'bind'},
  {a:'r',    label:'RIGHT', type:'bind'},
  {a:'u',    label:'UP',    type:'bind'},
  {a:'d',    label:'DOWN',  type:'bind'},
  {a:'fire', label:'FIRE',  type:'bind'},
  {a:'jump', label:'JUMP',  type:'bind'},
  {type:'reset', label:'RESET TO DEFAULTS'},
  {type:'back',  label:'BACK'}
];
function openOptions(from){ optionsOpen=true; optSel=0; rebindFor=null; optFrom=from||'title'; }
function closeOptions(){ optionsOpen=false; rebindFor=null; saveState(); }
function keyLabel(code){
  return String(code||'').replace(/^Key/,'').replace(/^Digit/,'')
    .replace(/^Arrow/,'').replace('Space','SPACE').toUpperCase();
}
function optAdjust(dir){
  const row=OPT_ROWS[optSel]; if(!row) return;
  if(row.type==='slider'){
    settings[row.k]=clamp(+(settings[row.k]+dir*0.1).toFixed(2),0,1);
    applyVolumes(); if(dir>0) Audio_.tone(880,0.04,'square',0.10); saveState();
  } else if(row.type==='toggle'){
    settings.muted=!settings.muted; applyVolumes(); saveState();
  }
}
function optChoose(){
  const row=OPT_ROWS[optSel]; if(!row) return;
  if(row.type==='bind'){ rebindFor=row.a; return; }
  if(row.type==='toggle'||row.type==='slider'){ optAdjust(1); return; }
  if(row.type==='fs'){ settings.fullscreen=!settings.fullscreen; toggleFullscreen(); saveState(); return; }
  if(row.type==='reset'){
    settings.binds=JSON.parse(JSON.stringify(DEF_BINDS));
    settings.master=0.5; settings.music=0.30; settings.sfx=0.55; settings.muted=false;
    applyVolumes(); saveState(); Audio_.coin(); return;
  }
  if(row.type==='back') closeOptions();
}
/* capture a key for the row being rebound; Escape cancels */
function optCaptureKey(code){
  if(!rebindFor) return false;
  if(code==='Escape'){ rebindFor=null; return true; }
  for(const a in settings.binds)                     /* keep bindings unique */
    settings.binds[a]=settings.binds[a].filter(c=>c!==code);
  settings.binds[rebindFor]=[code].concat(settings.binds[rebindFor]).slice(0,2);
  if(!settings.binds[rebindFor].length) settings.binds[rebindFor]=[code];
  rebindFor=null; saveState(); Audio_.coin();
  return true;
}
function drawOptions(g){
  /* near-opaque: the title art behind this is busy and was reading through */
  g.fillStyle='rgba(3,6,10,.97)'; g.fillRect(0,0,W,H);
  g.fillStyle='rgba(230,57,70,.5)'; g.fillRect(0,20,W,1);
  drawTextCSh(g,'OPTIONS',W/2,6,'#ffe27a','#3a1a10',2);
  for(let i=0;i<OPT_ROWS.length;i++){
    const row=OPT_ROWS[i], on=i===optSel, y=26+i*13;
    if(on){ g.fillStyle='rgba(255,226,122,.13)'; g.fillRect(18,y-3,W-36,12); }
    const col=on?'#ffe27a':'#8a97a8';
    drawText(g,(on?'>':' ')+row.label,24,y,col,1);
    if(row.type==='slider'){
      /* drawn, not spelled: the bitmap font has no # or [ ] glyphs */
      const nb=Math.round(settings[row.k]*10);
      for(let c=0;c<10;c++){
        g.fillStyle = c<nb ? (on?'#ffe27a':'#7f8b9c') : 'rgba(255,255,255,.10)';
        g.fillRect(W-30-(10-c)*8, y, 6, 7);
      }
    } else {
      let val='';
      if(row.type==='toggle') val=settings.muted?'ON':'OFF';
      else if(row.type==='fs') val=(document.fullscreenElement?'ON':'OFF');
      else if(row.type==='bind') val=(rebindFor===row.a)?'PRESS A KEY':
        settings.binds[row.a].map(keyLabel).join(' / ');
      if(val) drawText(g,val,W-24-textW(val,1),y,rebindFor===row.a?'#ff9c3f':col,1);
    }
  }
  drawTextC(g,'ESC OR BACK TO CLOSE  -  PAD AND KEYBOARD BOTH WORK',W/2,H-11,'#4e5a6b',1);
}

/* =============================================================== continues ==
   Losing your last life used to dump you to the title with both stages to
   replay. A continue rebuilds the current stage with a fresh set of lives and
   keeps the score you earned. */
let goSel=0;
const GO_ITEMS=['CONTINUE','OPTIONS','QUIT TO TITLE'];
function goChoose(){
  const it=GO_ITEMS[goSel];
  if(it==='CONTINUE'){
    continuesUsed++; lives=konamiOn?30:3;
    restartStage(); Audio_.coin();
  } else if(it==='OPTIONS'){ openOptions('gameover'); }
  else { stage=1; buildBackdrop(); buildLevel(); resetRun(); state='TITLE'; titleT=0; }
}

/* ------------------------------------------------------------ mouse input */
/* Left click fires, same as Z. Always registered — a machine can have both a
   touchscreen and a mouse, and gating this on isTouch left such machines with no
   click at all. Instead ignore the synthetic mouse events a tap generates, by
   skipping anything that lands right after a real touch. */
let lastTouchAt=0;
for(const ev of ['touchstart','touchend','touchmove'])
  addEventListener(ev,()=>{ lastTouchAt=Date.now(); },{passive:true,capture:true});
addEventListener('mousedown',e=>{
  if(e.button!==0 || Date.now()-lastTouchAt<700) return;
  e.preventDefault();
  Audio_.init(); Audio_.resume();
  if(state!=='PLAY'){ doStart(); return; }   /* click also starts / advances */
  keys.fire=true; pressed.fire=true;
});
addEventListener('mouseup',e=>{ if(e.button===0) keys.fire=false; });

/* ----------------------------------------------------------------- resize */
function fit(){
  if(isTouch){
    /* phones are small: fill the viewport with a fractional scale rather than
       snapping to an integer one, which would drop a 390px-tall screen to 1x */
    const vv=window.visualViewport, vw=vv?vv.width:innerWidth, vh=vv?vv.height:innerHeight;
    const s=Math.min(vw/W, vh/H);
    cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
    /* how far the stick reaches into the playfield, in game px (getBoundingClientRect
       flushes the layout above, and picks up the safe-area inset for free) */
    /* the ring floats to the thumb now, so this can't key off a fixed rect. cover a thumb
       resting anywhere in the left half of the activation zone (inset included) */
    const zr=document.getElementById('stickZone').getBoundingClientRect(), cr=cv.getBoundingClientRect();
    padLeft = zr.width ? clamp(Math.round((zr.left+zr.width*0.5+RING-cr.left)/s)+8, 0, Math.round(W*0.28)) : 0;
    return;
  }
  const pad=54;
  const s=Math.max(1,Math.min(Math.floor((innerWidth-16)/W), Math.floor((innerHeight-pad)/H)));
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,120));
if(window.visualViewport) visualViewport.addEventListener('resize',fit);

/* ------------------------------------------------------------------ start */
loadState();
buildSprites();
buildBackdrop();
buildLevel();
resetRun();
state='TITLE';
fit();
requestAnimationFrame(loop);
</script>
