/* ------------------------------------------------------------------ utils */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const rndi=(a,b)=>Math.floor(rnd(a,b));
const pick=a=>a[(Math.random()*a.length)|0];
const TAU=Math.PI*2;
function hash(n){ n=(n<<13)^n; return 1-((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/1073741824; }
function noise1(x){ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); return lerp(hash(i),hash(i+1),u); }
function fbm(x){ let s=0,a=.5,f=1; for(let i=0;i<4;i++){ s+=noise1(x*f)*a; a*=.5; f*=2;} return s; }
function aabb(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function textW(s,sc=1){ return (s.length*6-1)*sc; }
function drawText(g,s,x,y,col,sc=1){
  s=String(s).toUpperCase(); g.fillStyle=col;
  for(let i=0;i<s.length;i++){
    const gl=GLYPH[s[i]]; if(!gl) continue;
    const ox=x+i*6*sc;
    for(let r=0;r<7;r++){ const row=gl[r];
      for(let c=0;c<5;c++) if(row[c]==='1') g.fillRect(ox+c*sc, y+r*sc, sc, sc); }
  }
}
function drawTextC(g,s,cx,y,col,sc=1){ drawText(g,s,Math.round(cx-textW(s,sc)/2),y,col,sc); }
function drawTextSh(g,s,x,y,col,sh,sc=1){ drawText(g,s,x+sc,y+sc,sh,sc); drawText(g,s,x,y,col,sc); }

/* ------------------------------------------------------------------ audio */
const Audio_ = {
  ac:null, master:null, muted:false, ready:false, musicOn:true,
  step:0, next:0, tempo:0.115,
  init(){
    if(this.ac) return;
    try{ this.ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    this.master=this.ac.createGain(); this.master.gain.value=0.5; this.master.connect(this.ac.destination);
    this.mus=this.ac.createGain(); this.mus.gain.value=0.30; this.mus.connect(this.master);
    this.sfx=this.ac.createGain(); this.sfx.gain.value=0.55; this.sfx.connect(this.master);
    this.next=this.ac.currentTime+0.05; this.ready=true;
  },
  resume(){ if(this.ac && this.ac.state==='suspended') this.ac.resume(); },
  tone(f,dur,type='square',vol=.25,slide=0,dest=null){
    if(!this.ready||this.muted) return;
    const t=this.ac.currentTime, o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||this.sfx); o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur,vol=.3,filt=1200,sweep=0.3){
    if(!this.ready||this.muted) return;
    const t=this.ac.currentTime, n=Math.floor(this.ac.sampleRate*dur);
    const buf=this.ac.createBuffer(1,n,this.ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=this.ac.createBufferSource(); src.buffer=buf;
    const bp=this.ac.createBiquadFilter(); bp.type='lowpass';
    bp.frequency.setValueAtTime(filt,t); bp.frequency.exponentialRampToValueAtTime(Math.max(80,filt*sweep),t+dur);
    const g=this.ac.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(bp); bp.connect(g); g.connect(this.sfx); src.start(t);
  },
  shoot(){ this.tone(880,0.05,'square',0.10,0.35); this.noise(0.04,0.10,3000,0.4); },
  shootBig(){ this.tone(520,0.09,'sawtooth',0.13,0.3); this.noise(0.07,0.14,2200,0.3); },
  laser(){ this.tone(1400,0.13,'sawtooth',0.11,0.25); },
  jump(){ this.tone(300,0.13,'square',0.13,2.6); },
  hit(){ this.noise(0.07,0.20,1800,0.25); this.tone(180,0.06,'square',0.10,0.5); },
  boom(big){ this.noise(big?0.55:0.26, big?0.5:0.32, big?900:1400, 0.12);
             this.tone(big?90:150, big?0.5:0.24,'triangle',big?0.28:0.18,0.35); },
  power(){ [660,880,1100,1320].forEach((f,i)=>setTimeout(()=>this.tone(f,0.10,'square',0.16),i*55)); },
  die(){ [660,560,470,380,300,220].forEach((f,i)=>setTimeout(()=>this.tone(f,0.14,'square',0.16,0.7),i*70)); this.noise(0.5,0.25,900,0.2); },
  coin(){ this.tone(1046,0.05,'square',0.14); setTimeout(()=>this.tone(1568,0.10,'square',0.14),50); },
  /* --- sequencer : original driving march in E minor --- */
  LEAD:[76,-2,74,-2,71,-2,74,-2, 76,-2,79,76,74,-2,71,-2,
        69,-2,71,-2,74,-2,71,-2, 69,67,69,71,74,-2,-2,-2,
        76,-2,74,-2,71,-2,74,-2, 76,-2,79,83,81,-2,79,-2,
        78,-2,76,-2,74,-2,71,-2, 76,-2,-2,-2,-2,-2,-2,-2],
  BASS:[40,40,52,40,40,40,52,40, 36,36,48,36,36,36,48,36,
        38,38,50,38,38,38,50,38, 40,40,52,40,47,47,45,45,
        40,40,52,40,40,40,52,40, 36,36,48,36,36,36,48,36,
        38,38,50,38,42,42,54,42, 40,40,40,40,40,40,47,47],
  mtof(m){ return 440*Math.pow(2,(m-69)/12); },
  tick(){
    if(!this.ready||this.muted||!this.musicOn) return;
    const t=this.ac.currentTime;
    while(this.next < t+0.12){
      const s=this.step%64, when=this.next;
      const ln=this.LEAD[s];
      if(ln>0){ this.seqTone(this.mtof(ln),0.16,'square',0.16,when); this.seqTone(this.mtof(ln+12),0.14,'square',0.045,when); }
      const bn=this.BASS[s];
      if(bn>0) this.seqTone(this.mtof(bn),0.11,'triangle',0.30,when);
      if(s%4===0) this.seqNoise(0.09,0.30,260,when);
      if(s%8===4) this.seqNoise(0.11,0.22,2600,when);
      this.seqNoise(0.03,s%2?0.05:0.09,7000,when);
      this.next+=this.tempo; this.step++;
    }
  },
  seqTone(f,dur,type,vol,when){
    const o=this.ac.createOscillator(), g=this.ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f,when);
    g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(vol,when+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
    o.connect(g); g.connect(this.mus); o.start(when); o.stop(when+dur+0.02);
  },
  seqNoise(dur,vol,filt,when){
    const n=Math.floor(this.ac.sampleRate*dur);
    const buf=this.ac.createBuffer(1,n,this.ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=this.ac.createBufferSource(); src.buffer=buf;
    const f=this.ac.createBiquadFilter(); f.type= filt<600?'lowpass':'bandpass'; f.frequency.value=filt;
    const g=this.ac.createGain(); g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
    src.connect(f); f.connect(g); g.connect(this.mus); src.start(when);
  }
};

/* ---------------------------------------------------------------- sprites */
function makeSprite(rows,pal){
  const w=rows[0].length,h=rows.length;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++){ const row=rows[y];
    for(let x=0;x<w;x++){ const col=pal[row[x]]; if(col){ g.fillStyle=col; g.fillRect(x,y,1,1); } } }
  c.flipped=flipCanvas(c); c.white=whiteCanvas(c);
  return c;
}
function flipCanvas(src){
  const c=document.createElement('canvas'); c.width=src.width; c.height=src.height;
  const g=c.getContext('2d'); g.translate(src.width,0); g.scale(-1,1); g.drawImage(src,0,0); return c;
}
function whiteCanvas(src){
  const c=document.createElement('canvas'); c.width=src.width; c.height=src.height;
  const g=c.getContext('2d'); g.drawImage(src,0,0); g.globalCompositeOperation='source-in';
  g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
  c.flipped=flipCanvas(c); return c;
}
function blit(g,spr,x,y,flip,white){
  const px=Math.round(x), py=Math.round(y);
  g.drawImage(flip?spr.flipped:spr, px, py);
  if(white){                       /* hit flash keeps the silhouette readable */
    g.save(); g.globalAlpha=0.74;
    g.drawImage(flip?spr.white.flipped:spr.white, px, py);
    g.restore();
  }
}

/* --------------------------------------------------------------- backdrop */
let bgFar, bgMid, bgNear, groundCv, fgCv;
const LVL_W = 3400;
const GY = 176;                 /* ground surface y */

function makeLayer(w,h,drawFn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  drawFn(c.getContext('2d'),w,h); return c;
}
function buildBackdrop(){
  /* --- far : sky + moon + mountains (tile 512) --- */
  bgFar = makeLayer(512,H,(g,w,h)=>{
    const sky=g.createLinearGradient(0,0,0,h);
    sky.addColorStop(0,'#120b28'); sky.addColorStop(.35,'#26184a');
    sky.addColorStop(.62,'#6b2f5a'); sky.addColorStop(.80,'#c2564f'); sky.addColorStop(1,'#f0925a');
    g.fillStyle=sky; g.fillRect(0,0,w,h);
    /* stars */
    for(let i=0;i<90;i++){ const x=(hash(i*7)*0.5+0.5)*w, y=(hash(i*13+3)*0.5+0.5)*h*0.55;
      const a=0.25+Math.abs(hash(i*3))*0.55; g.fillStyle=`rgba(255,235,255,${a})`; g.fillRect(x|0,y|0,1,1); }
    /* moon */
    g.fillStyle='#ffe9c9'; g.beginPath(); g.arc(392,44,17,0,TAU); g.fill();
    g.fillStyle='rgba(255,233,201,.10)'; g.beginPath(); g.arc(392,44,30,0,TAU); g.fill();
    g.fillStyle='rgba(190,160,140,.35)';
    [[386,38,4],[397,50,3],[398,37,2],[385,50,2]].forEach(c=>{g.beginPath();g.arc(c[0],c[1],c[2],0,TAU);g.fill();});
    /* mountain ridge */
    g.fillStyle='#2a1c40'; g.beginPath(); g.moveTo(0,h);
    for(let x=0;x<=w;x+=4){ const y=118 - fbm(x*0.010+11)*46 - fbm(x*0.031+3)*14; g.lineTo(x,y); }
    g.lineTo(w,h); g.closePath(); g.fill();
    g.fillStyle='#3c2851'; g.beginPath(); g.moveTo(0,h);
    for(let x=0;x<=w;x+=4){ const y=142 - fbm(x*0.014+41)*34; g.lineTo(x,y); }
    g.lineTo(w,h); g.closePath(); g.fill();
    /* haze */
    const hz=g.createLinearGradient(0,110,0,h); hz.addColorStop(0,'rgba(240,146,90,0)');
    hz.addColorStop(1,'rgba(240,146,90,.28)'); g.fillStyle=hz; g.fillRect(0,110,w,h-110);
  });

  /* --- mid : distant palm/tree canopy silhouettes (tile 480) --- */
  bgMid = makeLayer(480,H,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    const tree=(x,base,sc,col)=>{
      g.fillStyle=col;
      g.fillRect(x-1*sc,base-26*sc,2*sc,26*sc);                       /* trunk */
      for(let i=0;i<7;i++){                                            /* fronds */
        const a=(-Math.PI*0.92)+ i*(Math.PI*0.84/6) + hash(x+i)*0.16;
        const len=(13+hash(x*2+i)*7)*sc;
        g.save(); g.translate(x,base-26*sc); g.rotate(a);
        g.beginPath(); g.moveTo(0,0);
        g.quadraticCurveTo(len*0.6,-3*sc,len,3*sc);
        g.quadraticCurveTo(len*0.6, 2*sc,0,2.4*sc); g.closePath(); g.fill(); g.restore();
      }
    };
    for(let i=0;i<26;i++){ const x=(i*19+hash(i)*14+480)%480; tree(x,GY+6,0.8+hash(i*5)*0.5,'#1b2a2c'); }
    /* dark band of jungle behind */
    g.fillStyle='#14211f'; g.beginPath(); g.moveTo(0,h);
    for(let x=0;x<=w;x+=6){ g.lineTo(x, 148 - fbm(x*0.02+7)*16); } g.lineTo(w,h); g.closePath(); g.fill();
  });

  /* --- near : big foreground palms silhouette (tile 420) --- */
  bgNear = makeLayer(420,H,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    const col='#0d1717';
    for(let i=0;i<9;i++){
      const x=(i*47+hash(i*3)*22)%w, base=GY+8, sc=1.35+hash(i*9)*0.6;
      g.fillStyle=col; g.fillRect(x-2,base-46*sc/1.35,4,46*sc/1.35);
      for(let k=0;k<8;k++){
        const a=(-Math.PI*0.95)+k*(Math.PI*0.9/7)+hash(x+k*3)*0.15, len=(20+hash(x+k)*11)*sc;
        g.save(); g.translate(x,base-46*sc/1.35); g.rotate(a);
        g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(len*0.55,-5,len,4);
        g.quadraticCurveTo(len*0.5,3,0,3.5); g.closePath(); g.fill(); g.restore();
      }
    }
  });
}

/* ------------------------------------------------------------------ level */
let plats=[], solids=[], spawns=[], pits=[];
function G(x,w){ plats.push({x,y:GY,w,h:H-GY,type:'ground'}); }
function LEDGE(x,y,w,type='rock'){ plats.push({x,y,w,h:8,type}); }

function buildLevel(){
  plats=[];solids=[];spawns=[];pits=[];
  const segs=[[0,600],[648,452],[1148,112],[1308,592],[1948,452],[2448,952]];
  segs.forEach(s=>G(s[0],s[1]));
  for(let i=0;i<segs.length-1;i++){
    const a=segs[i][0]+segs[i][1], b=segs[i+1][0];
    pits.push({x:a,w:b-a});
  }
  [[300,138,64],[700,140,90],[860,112,70],[1176,128,64,'bridge'],
   [1400,142,80],[1524,114,80],[1648,86,80],
   [1980,140,90],[2124,110,90],[2244,142,70],
   [2520,140,100],[2700,108,90],[2840,140,80],
   [3040,142,64],[3120,108,120]].forEach(l=>LEDGE(l[0],l[1],l[2],l[3]));
  /* fortress wall — player is stopped at x=3263, boss hardware protrudes from the face */
  solids.push({x:3272,y:0,w:128,h:GY});

  buildTerrainCanvas();
  buildSpawnTable();
}

function onGroundAt(x){ /* returns platform top or null for a world x at ground level */
  for(const p of plats) if(p.type==='ground' && x>=p.x && x<=p.x+p.w) return p;
  return null;
}

function buildTerrainCanvas(){
  groundCv = makeLayer(LVL_W,H,(g)=>{
    g.clearRect(0,0,LVL_W,H);
    /* chasm water */
    for(const p of pits){
      const grd=g.createLinearGradient(0,GY-4,0,H);
      grd.addColorStop(0,'#0a0f14'); grd.addColorStop(.45,'#0e1b28'); grd.addColorStop(1,'#16324a');
      g.fillStyle=grd; g.fillRect(p.x-2,GY-4,p.w+4,H-GY+4);
    }
    for(const p of plats){
      const {x,y,w}=p;
      if(p.type==='ground'){
        /* dirt body */
        const grd=g.createLinearGradient(0,y,0,H);
        grd.addColorStop(0,'#4a3a24'); grd.addColorStop(.30,'#33281a'); grd.addColorStop(1,'#161109');
        g.fillStyle=grd; g.fillRect(x,y,w,H-y);
        /* strata bands */
        for(let s=0;s<4;s++){
          const sy=y+7+s*8;
          g.fillStyle=`rgba(${s%2?90:24},${s%2?72:18},${s%2?46:12},.22)`;
          for(let px=x;px<x+w;px+=3){
            const d=Math.round(fbm(px*0.05+s*9)*4-2);
            g.fillRect(px,sy+d,3,3);
          }
        }
        /* rocky speckle */
        for(let i=0;i<w*1.3;i++){
          const px=x+((hash(x*3+i*7)*0.5+0.5)*w)|0, py=y+5+((hash(i*13+x)*0.5+0.5)*(H-y-5))|0;
          const v=hash(i*5+x);
          g.fillStyle= v>0.45?'rgba(126,101,64,.5)': v>-0.1?'rgba(12,8,5,.5)':'rgba(158,128,82,.28)';
          g.fillRect(px,py,1+(v>0.8?1:0),1);
        }
        /* turf: dark base, lit top, sparse blades */
        g.fillStyle='#1e4420'; g.fillRect(x,y,w,5);
        g.fillStyle='#2c6630'; g.fillRect(x,y,w,3);
        g.fillStyle='#468c3c'; g.fillRect(x,y,w,1);
        /* blades: irregular walk along the surface, with bald patches + clumps */
        for(let px=x+2, i=0; px<x+w-2; i++){
          const seed=hash(i*11+x*0.7);
          px += 3 + ((hash(i*7+x)*0.5+0.5)*9|0);         /* uneven spacing */
          if(px>x+w-2) break;
          if(seed<0.05) continue;                        /* bald patch */
          const clump = seed>0.62 ? 3 : seed>0.3 ? 2 : 1;
          for(let c=0;c<clump;c++){
            const bx=px+c*2; if(bx>x+w-2) break;
            const hgt=2+((hash(i*3+c*5+x)*0.5+0.5)*4|0);
            g.fillStyle= hash(i+c*3)>0.2?'#5aa64a':'#2c6630';
            g.fillRect(bx,y-hgt,1,hgt);
          }
        }
        /* cliff sides */
        g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(x,y,2,H-y); g.fillRect(x+w-2,y,2,H-y);
        g.fillStyle='rgba(255,214,150,.10)'; g.fillRect(x+2,y+5,1,H-y);
      } else if(p.type==='bridge'){
        g.fillStyle='#5a4326'; g.fillRect(x,y,w,7);
        g.fillStyle='#3a2a17'; for(let i=0;i<w;i+=6) g.fillRect(x+i,y,1,7);
        g.fillStyle='#7a5c33'; g.fillRect(x,y,w,1);
        g.fillStyle='#241a0f'; g.fillRect(x,y+7,w,2);
      } else {
        /* rock ledge slab */
        const grd=g.createLinearGradient(0,y,0,y+10);
        grd.addColorStop(0,'#665d52'); grd.addColorStop(.35,'#40392f'); grd.addColorStop(1,'#1d1914');
        g.fillStyle=grd; g.fillRect(x,y,w,10);
        g.fillStyle='#8a8074'; g.fillRect(x,y,w,1);
        /* moss only in patches, not a neon stripe */
        for(let i=0;i<w;i+=2){
          const m=hash(i*7+x*1.3);
          if(m>0.05){ g.fillStyle= m>0.55?'#3f7d38':'#26512478'; g.fillRect(x+i,y,2,m>0.55?2:1);
            if(m>0.75) g.fillRect(x+i,y-1,1,1); }
        }
        for(let i=0;i<w;i+=4){ g.fillStyle='rgba(0,0,0,.32)'; g.fillRect(x+i,y+4+((hash(i+x)*0.5+0.5)*4|0),2,1); }
        g.fillStyle='rgba(0,0,0,.6)'; g.fillRect(x,y+9,w,2);
        /* timber support posts */
        for(let i=6;i<w-4;i+=20){
          const px=x+i, ht=GY-y-10;
          g.fillStyle='#241c13'; g.fillRect(px,y+10,4,ht);
          g.fillStyle='#3a2c1c'; g.fillRect(px,y+10,1,ht);
          for(let k=8;k<ht;k+=13){ g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(px,y+10+k,4,1); }
        }
        /* hanging vines */
        for(let i=3;i<w-3;i+=17){
          if(hash(i*3+x)<0.25) continue;
          const px=x+i, ln=5+((hash(i+x*2)*0.5+0.5)*11|0);
          g.fillStyle='#24501f';
          for(let k=0;k<ln;k++) g.fillRect(px+Math.round(Math.sin(k*0.5)*1), y+10+k, 1,1);
          g.fillStyle='#397a30'; g.fillRect(px,y+10+ln-1,2,2);
        }
      }
    }
    /* scattered props */
    for(let i=0;i<220;i++){
      const x=((i*17.3+hash(i)*30)+LVL_W)%LVL_W|0;
      const gp=onGroundAt(x); if(!gp) continue;
      const t=i%6;
      if(t===0){ /* bush */
        g.fillStyle='#1f4a24'; g.beginPath(); g.arc(x,GY-2,5,Math.PI,0); g.fill();
        g.fillStyle='#2c6a2c'; g.beginPath(); g.arc(x-2,GY-2,3,Math.PI,0); g.fill();
      } else if(t===1){ /* rock */
        g.fillStyle='#4a453e'; g.fillRect(x,GY-4,7,4); g.fillStyle='#6a6157'; g.fillRect(x+1,GY-5,4,2);
        g.fillStyle='#211e1a'; g.fillRect(x,GY-1,7,1);
      } else if(t===2){ /* tall grass */
        g.strokeStyle='#2f7a35'; g.lineWidth=1;
        for(let k=0;k<4;k++){ g.beginPath(); g.moveTo(x+k*2,GY); g.quadraticCurveTo(x+k*2+2,GY-6,x+k*2+5,GY-9); g.stroke(); }
      } else if(t===3 && i%12===3){ /* barrel */
        g.fillStyle='#7a3a2a'; g.fillRect(x,GY-11,8,11); g.fillStyle='#a1503a'; g.fillRect(x+1,GY-11,2,11);
        g.fillStyle='#2b1a14'; g.fillRect(x,GY-8,8,1); g.fillRect(x,GY-4,8,1);
      }
    }
    /* fortress wall */
    const wx=3272, ww=128;
    const wg=g.createLinearGradient(0,0,0,GY);
    wg.addColorStop(0,'#2e343f'); wg.addColorStop(.5,'#242932'); wg.addColorStop(1,'#14171d');
    g.fillStyle=wg; g.fillRect(wx,0,ww,GY);
    for(let y=0;y<GY;y+=12) for(let x=0;x<ww;x+=22){
      const ox=(y/12)%2?11:0;
      g.strokeStyle='rgba(0,0,0,.55)'; g.strokeRect(wx+x+ox+.5,y+.5,22,12);
      g.fillStyle='rgba(190,215,255,.05)'; g.fillRect(wx+x+ox+1,y+1,21,1);
      if(hash(x*3+y)>0.55){ g.fillStyle='rgba(0,0,0,.16)'; g.fillRect(wx+x+ox+1,y+1,21,11); }
    }
    /* moss/rust weathering creeping up from the base */
    for(let i=0;i<260;i++){
      const px=wx+((hash(i*5)*0.5+0.5)*ww)|0, py=GY-((hash(i*9)*0.5+0.5)**2*GY)|0;
      g.fillStyle= hash(i*3)>0.3?'rgba(46,74,42,.30)':'rgba(94,62,38,.24)';
      g.fillRect(px,py,2,2);
    }
    g.fillStyle='#1a1e25'; g.fillRect(wx-4,0,6,GY);
    g.fillStyle='#48505c'; g.fillRect(wx-4,0,2,GY);
    /* rivets */
    for(let y=8;y<GY;y+=24) for(let x=8;x<ww;x+=24){ g.fillStyle='#4d5561'; g.fillRect(wx+x,y,2,2); }
    /* hazard stripes at the gate base */
    for(let i=0;i<13;i++){ g.fillStyle=i%2?'#9c8c2c':'#1c1e24'; g.fillRect(wx+i*10,GY-12,10,12); }
    g.fillStyle='rgba(0,0,0,.35)'; g.fillRect(wx,GY-12,ww,2);
  });

  /* foreground foliage overlay */
  fgCv = makeLayer(LVL_W,H,(g)=>{
    g.clearRect(0,0,LVL_W,H);
    /* near-black so it separates from the mid-layer jungle, rooted below frame */
    for(let i=0;i<74;i++){
      const x=(i*47+hash(i*7)*34)%LVL_W;
      if(x>3150) continue;
      const sc=1+Math.abs(hash(i*13))*0.7;
      g.fillStyle='rgba(3,8,7,.96)';
      for(let k=0;k<7;k++){
        const a=(-Math.PI*0.95)+k*(Math.PI*0.9/6)+hash(x+k)*0.18, len=(26+hash(x*2+k)*18)*sc;
        g.save(); g.translate(x,H+10); g.rotate(a);
        g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(len*0.55,-8,len,6);
        g.quadraticCurveTo(len*0.5,5,0,6); g.closePath(); g.fill(); g.restore();
      }
    }
  });
}

/* ------------------------------------------------------------ spawn table */
function buildSpawnTable(){
  const S=(x,fn)=>spawns.push({x,fn,done:false});
  const run=(x,y,dir)=>()=>enemies.push(mkRunner(x,y,dir));
  const gun=(x,y,dir)=>()=>enemies.push(mkGunner(x,y,dir));
  const jmp=(x,y)=>()=>enemies.push(mkJumper(x,y));
  const tur=(x,y)=>()=>enemies.push(mkTurret(x,y));
  const bnk=(x,y)=>()=>enemies.push(mkBunker(x,y));
  const mor=(x,y)=>()=>enemies.push(mkMortar(x,y));
  const falcon=(x,wp)=>()=>pickups.push(mkFalcon(x,wp));

  S(60,run(400,GY,-1)); S(120,run(440,GY,-1)); S(170,gun(330,138,-1));

  S(360,tur(716,140)); S(400,run(760,GY,-1)); S(430,run(800,GY,-1));
  S(470,gun(880,112,-1)); S(520,jmp(900)); S(560,run(980,GY,-1));
  S(600,run(1030,GY,-1)); S(640,bnk(1040,GY));
  S(760,falcon(1160,'S'));
  S(800,run(1200,128,-1)); S(860,run(1340,GY,-1)); S(880,run(1380,GY,-1));
  S(920,tur(1416,142)); S(980,gun(1540,114,-1)); S(1030,gun(1664,86,-1));
  S(1060,jmp(1500)); S(1090,run(1560,GY,-1)); S(1120,run(1600,GY,-1));
  S(1180,mor(1720,GY)); S(1220,run(1760,GY,-1)); S(1260,bnk(1800,GY));
  S(1320,run(1860,GY,-1)); S(1360,run(1890,GY,-1));
  S(1420,falcon(1980,'L'));
  S(1460,gun(2000,140,-1)); S(1500,tur(2140,110)); S(1540,run(2100,GY,-1));
  S(1580,jmp(2160)); S(1620,run(2210,GY,-1)); S(1660,run(2250,GY,-1));
  S(1700,mor(2320,GY)); S(1740,run(2360,GY,-1));
  S(1820,run(2500,GY,-1)); S(1840,run(2540,GY,-1)); S(1870,gun(2540,140,-1));
  S(1920,bnk(2600,GY)); S(1960,tur(2716,108)); S(2000,jmp(2680));
  S(2040,falcon(2760,'F'));
  S(2080,run(2820,GY,-1)); S(2110,run(2860,GY,-1)); S(2140,gun(2856,140,-1));
  S(2200,mor(2960,GY)); S(2240,run(3000,GY,-1)); S(2270,run(3040,GY,-1));
  S(2320,bnk(3080,GY)); S(2380,run(3140,GY,-1)); S(2420,gun(3056,142,-1));
  S(2600,()=>{ startBoss(); });
}

/* -------------------------------------------------------------- entities  */
let player, bullets=[], ebullets=[], enemies=[], pickups=[], parts=[], floats=[];
let cam={x:0,y:0,lock:false,max:0}, shake=0, hitstop=0, frame=0;
/* playfield width (in game px) hidden behind the on-screen stick — measured in fit(),
   since the safe-area inset pushes the stick further in on a notched phone.
   RING is the stick's radius; it lives out here because fit() needs it too. */
let padLeft=0; const RING=52;
let score=0, lives=3, weapon='R', stageTime=0;
let boss=null, bossActive=false, bossDeadT=0;
let state='TITLE', stateT=0, fade=0, konamiOn=false;

/* shield: soaks SHIELD_MAX hits, refills after SHIELD_REGEN frames without being hit.
   SHIELD_HIT_INV is the mercy window after an absorb, so one burst can't eat all three. */
const SHIELD_MAX=3, SHIELD_REGEN=300, SHIELD_HIT_INV=52;
function mkPlayer(x,y){
  return {x,y,w:9,h:22,vx:0,vy:0,dir:1,onGround:false,prone:false,
    aim:0, animT:0, frameI:0, spinT:0, fireCd:0, dropT:0,
    dead:false, deadT:0, inv:120, barrier:0, walkOut:false,
    shield:SHIELD_MAX, regenT:0, shieldFlash:0};
}
function resetRun(){
  bullets=[];ebullets=[];enemies=[];pickups=[];parts=[];floats=[];
  score=0; lives=konamiOn?30:3; weapon='R'; boss=null; bossActive=false; bossDeadT=0;
  cam={x:0,y:0,lock:false,max:0}; shake=0; stageTime=0;
  spawns.forEach(s=>s.done=false);
  player=mkPlayer(40,GY-24);
}

/* --- enemy factories --- */
function baseEnemy(o){ return Object.assign({w:12,h:20,vx:0,vy:0,dir:-1,hp:1,t:0,flash:0,dead:false,score:100},o); }
function mkRunner(x,y,dir){ return baseEnemy({type:'runner',x,y:y-20,hp:1,dir,vx:dir*1.05,score:100,fireT:rndi(40,110)}); }
function mkGunner(x,y,dir){ return baseEnemy({type:'gunner',x,y:y-20,hp:2,dir,score:200,fireT:rndi(30,70),burst:0}); }
function mkJumper(x){ return baseEnemy({type:'jumper',x,y:GY+20,hp:1,dir:-1,vy:-5.2,score:150,state:'rise'}); }
function mkTurret(x,y){ return baseEnemy({type:'turret',x,y:y-14,w:16,h:14,hp:6,score:500,fireT:60,ang:Math.PI,burst:0}); }
function mkBunker(x,y){ return baseEnemy({type:'bunker',x,y:y-22,w:22,h:22,hp:8,score:700,fireT:90,open:0}); }
function mkMortar(x,y){ return baseEnemy({type:'mortar',x,y:y-16,w:16,h:16,hp:5,score:600,fireT:70}); }
function mkDrone(x,y){ return baseEnemy({type:'drone',x,y,w:12,h:10,hp:2,score:300,t:rnd(TAU),fireT:60}); }
function mkFalcon(x,wp){ return {type:'falcon',x,y:60,w:16,h:12,t:0,wp,hp:1,dead:false,dir:1,vx:1.15}; }
function mkItem(x,y,wp){ return {type:'item',x,y,w:15,h:12,vy:0,wp,life:900,dead:false}; }

/* ---------------------------------------------------------------- effects */
function spark(x,y,n,col,spd=2.2,life=22){
  for(let i=0;i<n;i++){ const a=rnd(TAU);
    parts.push({x,y,vx:Math.cos(a)*rnd(spd,.3),vy:Math.sin(a)*rnd(spd,.3)-.4,
      life:rnd(life,life*.4),t:0,col,g:0.09,sz:1}); }
}
function explode(x,y,big){
  const n=big?26:14;
  for(let i=0;i<n;i++){ const a=rnd(TAU),s=rnd(big?3.4:2.2,.4);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:rnd(big?46:30,14),t:0,
      col:pick(['#fff3c4','#ffc14d','#ff7a2f','#e03b26']),g:0.12,sz:big?2:1}); }
  parts.push({x,y,ring:true,r:1,rmax:big?46:24,life:big?26:16,t:0});
  for(let i=0;i<(big?10:5);i++) parts.push({x,y,smoke:true,vx:rnd(1,-1),vy:rnd(-.3,-1.5),
    life:rnd(70,35),t:0,r:rnd(6,2)});
  shake=Math.max(shake,big?9:4);
  Audio_.boom(big);
}
function floatText(x,y,s,col){ floats.push({x,y,s,col,t:0,life:50}); }

/* ------------------------------------------------------------------ input */
const keys={}, pressed={};
const MAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',
  ArrowDown:'d',KeyS:'d',KeyZ:'fire',KeyJ:'fire',KeyX:'jump',KeyK:'jump',Space:'jump',
  Enter:'start',KeyP:'start',KeyM:'mute'};
/* fallback by e.key, for layouts/environments that don't report e.code */
const KMAP={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',
  a:'l',d:'r',w:'u',s:'d',z:'fire',j:'fire',x:'jump',k:'jump',' ':'jump',
  Enter:'start',p:'start',m:'mute'};
function actionFor(e){
  return MAP[e.code] || KMAP[e.key] || KMAP[String(e.key||'').toLowerCase()];
}
/* normalised code, so the konami check works without e.code too */
function codeOf(e){
  if(e.code) return e.code;
  const k=e.key||''; return k.length===1 ? 'Key'+k.toUpperCase() : k;
}
const KONAMI=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','KeyB','KeyA'];
let konamiIdx=0;
addEventListener('keydown',e=>{
  const a=actionFor(e), code=codeOf(e);
  if(a||code==='KeyB'){ e.preventDefault(); }
  if(e.repeat) return;
  if(a){ keys[a]=true; pressed[a]=true; }
  if(code===KONAMI[konamiIdx]){ konamiIdx++;
    if(konamiIdx===KONAMI.length){ konamiIdx=0; konamiOn=true; Audio_.init(); Audio_.power();
      floats.push({x:cam.x+W/2,y:130,s:'30 LIVES',col:'#ffd23f',t:0,life:120,big:true}); }
  } else konamiIdx = (code===KONAMI[0])?1:0;
  if(a==='mute'){ Audio_.init(); Audio_.muted=!Audio_.muted; if(Audio_.master) Audio_.master.gain.value=Audio_.muted?0:0.5; }
});
addEventListener('keyup',e=>{ const a=actionFor(e); if(a) keys[a]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });

/* ------------------------------------------------------------ player step */
const GRAV=0.38, MAXFALL=7.2, RUNSPD=2.0, JUMPV=-7.2;
/* airtime ~38f, apex ~68px, running jump range ~76px — gaps are 48px */

function platTop(p){ return p.y; }
function updatePlayer(){
  const p=player;
  if(p.dead){
    p.deadT++; p.spinT+=0.32; p.vy+=GRAV*0.75; p.y+=p.vy; p.x+=p.vx;
    if(p.deadT===1){ Audio_.die(); explode(p.x+5,p.y+11,false); }
    if(p.deadT>72){
      if(lives<=0){ state='GAMEOVER'; stateT=0; }
      else { lives--; respawn(); }
    }
    return;
  }
  if(p.walkOut){ p.vx=1.4; p.x+=p.vx; p.dir=1; p.animT+=0.28; p.frameI=1+(Math.floor(p.animT)%3); return; }

  if(p.inv>0) p.inv--;
  if(p.barrier>0) p.barrier--;
  if(p.dropT>0) p.dropT--;
  if(p.shieldFlash>0) p.shieldFlash--;
  /* out of combat (nothing has got through for SHIELD_REGEN frames) => back to full */
  if(p.shield<SHIELD_MAX && ++p.regenT>=SHIELD_REGEN){
    p.shield=SHIELD_MAX; p.regenT=0; p.shieldFlash=14;
    Audio_.power(); floatText(p.x, p.y-8, 'SHIELD UP', '#7fe3ff');
  }

  const L=keys.l,R=keys.r,U=keys.u,D=keys.d;
  /* prone only on ground with nothing else */
  p.prone = p.onGround && D && !U;

  let mv=0;
  if(!p.prone){ if(L) mv-=1; if(R) mv+=1; }
  if(mv) p.dir=mv;
  p.vx = mv*RUNSPD;

  /* aim vector angle (0 = facing dir) */
  let ax=0,ay=0;
  if(U&&!D){ ay=-1; if(L||R) ax=(L?-1:1); }
  else if(D&&!U&&!p.onGround){ ay=1; if(L||R) ax=(L?-1:1); }
  else { ax=(L||R)?(L?-1:1):p.dir; }
  if(p.prone){ ax=p.dir; ay=0; }
  if(ax===0&&ay===0) ax=p.dir;
  p.aim=Math.atan2(ay,ax);

  /* jump */
  if(pressed.jump && p.onGround){
    if(D && standingOnLedge(p)){ p.dropT=10; p.y+=2; p.onGround=false; }
    else { p.vy=JUMPV; p.onGround=false; p.spinT=0; Audio_.jump(); }
  }
  if(!keys.jump && p.vy<-2.4) p.vy=-2.4;   /* variable height */

  p.vy=Math.min(MAXFALL,p.vy+GRAV);
  p.x+=p.vx;
  /* horizontal solids */
  for(const s of solids){
    if(p.x+p.w>s.x && p.x<s.x+s.w && p.y+p.h>s.y && p.y<s.y+s.h){
      if(p.vx>0) p.x=s.x-p.w; else if(p.vx<0) p.x=s.x+s.w;
    }
  }
  /* backing up must not slide the player in behind the stick, since the camera
     never scrolls back — padLeft is 0 on desktop */
  p.x=clamp(p.x, cam.x+2+padLeft, cam.x+W-p.w-2);

  const prevBottom=p.y+PH;
  p.y+=p.vy;
  const bottom=p.y+PH;
  p.onGround=false;
  if(p.vy>=0 && p.dropT<=0){
    for(const pl of plats){
      const top=platTop(pl);
      if(p.x+p.w>pl.x+1 && p.x<pl.x+pl.w-1 && prevBottom<=top+1 && bottom>=top){
        p.y=top-PH; p.vy=0; p.onGround=true; p.spinT=0; break;
      }
    }
  }
  if(p.onGround && p.vx!==0 && !p.prone){ p.animT+=0.24; }
  else if(!p.onGround) p.spinT+=0.30;
  p.frameI = p.onGround ? (p.vx? (1+(Math.floor(p.animT)%3)) : 0) : 0;

  /* fall in pit */
  if(p.y>H+8) killPlayer(true);

  /* fire */
  if(p.fireCd>0) p.fireCd--;
  const wpn=WEAPONS[weapon];
  const wantFire = wpn.auto ? keys.fire : pressed.fire;
  if(wantFire && p.fireCd<=0 && bullets.length<wpn.max) fire();
}
const PH=22;                                  /* collision height (constant) */
function ph(p){ return PH; }
/* hurtbox — shrinks when prone so bullets pass overhead */
function hb(p){ return p.prone ? {x:p.x,y:p.y+12,w:p.w,h:10} : {x:p.x,y:p.y,w:p.w,h:PH}; }
function standingOnLedge(p){
  for(const pl of plats){ if(pl.type!=='ground' && Math.abs((p.y+PH)-pl.y)<2 && p.x+p.w>pl.x && p.x<pl.x+pl.w) return true; }
  return false;
}
function muzzle(){
  const p=player;
  const cx=p.x+p.w/2, cy=p.y+(p.prone?5:9);
  return {x:cx+Math.cos(p.aim)*9, y:cy+Math.sin(p.aim)*9};
}
function fire(){
  const p=player, w=WEAPONS[weapon], m=muzzle();
  p.fireCd=w.cd;
  const add=(a,extra)=>bullets.push(Object.assign({x:m.x-1.5,y:m.y-1.5,w:3,h:3,
    vx:Math.cos(a)*w.spd, vy:Math.sin(a)*w.spd, dmg:w.dmg, life:150, kind:weapon, col:w.col, t:0},extra||{}));
  if(weapon==='S'){ for(let i=-2;i<=2;i++) add(p.aim+i*0.20); Audio_.shootBig(); }
  else if(weapon==='L'){ add(p.aim,{pierce:true,w:10,h:3,len:14}); Audio_.laser(); }
  else if(weapon==='F'){ add(p.aim,{flame:true,ph:rnd(TAU),base:p.aim}); Audio_.shootBig(); }
  else { add(p.aim); Audio_.shoot(); }
  parts.push({x:m.x,y:m.y,flash:true,life:5,t:0,a:p.aim});
  shake=Math.max(shake, weapon==='S'||weapon==='L'?1.6:0.8);
}
function shieldAbsorb(p){
  p.shield--; p.regenT=0; p.inv=SHIELD_HIT_INV; p.shieldFlash=14;
  Audio_.hit(); shake=Math.max(shake,3);
  floatText(p.x, p.y-6, p.shield>0?'SHIELD '+p.shield:'SHIELD DOWN', p.shield>0?'#7fe3ff':'#ff9a4d');
  for(let i=0;i<12;i++){ const a=i*TAU/12;
    parts.push({x:p.x+5+Math.cos(a)*13, y:p.y+11+Math.sin(a)*13,
      vx:Math.cos(a)*1.7, vy:Math.sin(a)*1.7, life:rnd(26,12), t:0, col:'#7fe3ff', g:0.02, sz:1}); }
}
function killPlayer(fell){
  const p=player; if(p.dead||p.inv>0&&!fell) return;
  if(p.barrier>0 && !fell) return;
  /* a shot is soaked by the shield; a pit still kills outright */
  if(p.shield>0 && !fell){ shieldAbsorb(p); return; }
  p.dead=true; p.deadT=0; p.vy=fell?0:-3.4; p.vx=fell?0:-p.dir*1.2;
  if(fell){ p.deadT=42; p.y=H+40; Audio_.die(); Audio_.noise(0.35,0.25,700,0.2); }
  bullets.length=0;
}
function respawn(){
  const p=player;
  /* spawn past padLeft, else the left clamp in updatePlayer shoves the player off
     whichever platform we just picked here */
  let x=clamp(cam.x+30+padLeft, 0, LVL_W-30);
  const gp=onGroundAt(x+5) || onGroundAt(cam.x+80+padLeft);
  player=mkPlayer(gp?clamp(x,gp.x+4,gp.x+gp.w-14):x, -30);
  player.inv=150;
  weapon='R';
}

/* ------------------------------------------------------------ enemy logic */
function eShoot(e,tx,ty,spd,col){
  const a=Math.atan2(ty-(e.y+e.h/2), tx-(e.x+e.w/2));
  ebullets.push({x:e.x+e.w/2-2,y:e.y+e.h/2-2,w:4,h:4,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
    life:260,col:col||'#ffd23f',t:0});
  Audio_.tone(300,0.05,'square',0.07,0.6);
}
function updateEnemies(){
  const p=player, h=hb(p), pcx=h.x+h.w/2, pcy=h.y+h.h/2;
  for(const e of enemies){
    e.t++; if(e.flash>0) e.flash--;
    switch(e.type){
      case 'runner':{
        e.dir = Math.sign(pcx-(e.x+6))||e.dir;
        e.vx=e.dir*1.15; e.x+=e.vx;
        e.vy=Math.min(MAXFALL,e.vy+GRAV); e.y+=e.vy;
        landEnemy(e);
        if(--e.fireT<=0 && Math.abs(pcy-(e.y+10))<40 && Math.abs(pcx-e.x)<150){
          eShoot(e,pcx,pcy,2.1); e.fireT=rndi(70,130);
        }
        if(e.t>60 && Math.abs(pcx-e.x)<26 && Math.abs(pcy-(e.y+10))<18 && e.onG && Math.random()<0.03){ e.vy=-4.6; e.onG=false; }
        break; }
      case 'gunner':{
        e.dir = Math.sign(pcx-(e.x+6))||e.dir;
        e.vy=Math.min(MAXFALL,e.vy+GRAV); e.y+=e.vy; landEnemy(e);
        if(--e.fireT<=0){
          if(e.burst<=0) e.burst=3;
          eShoot(e,pcx,pcy,2.4,'#ff9c3f'); e.burst--;
          e.fireT = e.burst>0?9:rndi(70,120);
        }
        break; }
      case 'jumper':{
        e.vy+=GRAV*0.72; e.y+=e.vy;
        e.x += Math.sign(pcx-e.x)*0.55;
        if(e.t===1) Audio_.tone(220,0.1,'square',0.09,2.0);
        if(e.t===22) eShoot(e,pcx,pcy,2.3,'#ff6b6b');
        if(e.y>H+30) e.dead=true;
        break; }
      case 'turret':{
        const a=Math.atan2(pcy-(e.y+7), pcx-(e.x+8));
        e.ang = e.ang + Math.atan2(Math.sin(a-e.ang),Math.cos(a-e.ang))*0.06;
        if(--e.fireT<=0 && dist(e,p)<210){
          if(e.burst<=0) e.burst=3;
          const bx=e.x+8+Math.cos(e.ang)*11, by=e.y+7+Math.sin(e.ang)*11;
          ebullets.push({x:bx-2.5,y:by-2.5,w:5,h:5,vx:Math.cos(e.ang)*2.7,vy:Math.sin(e.ang)*2.7,life:260,col:'#ff5c3a',t:0});
          Audio_.tone(240,0.07,'square',0.09,0.6);
          e.burst--; e.fireT = e.burst>0?11:rndi(80,130);
        }
        break; }
      case 'bunker':{
        e.open = e.fireT<26 ? Math.min(1,e.open+0.14) : Math.max(0,e.open-0.10);
        if(--e.fireT<=0){
          for(let i=-1;i<=1;i++){
            const a=Math.atan2(pcy-(e.y+8), pcx-(e.x+11))+i*0.24;
            ebullets.push({x:e.x+11,y:e.y+8,w:4,h:4,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5,life:260,col:'#ffd23f',t:0});
          }
          Audio_.tone(200,0.09,'square',0.10,0.5);
          e.fireT=rndi(110,170);
        }
        break; }
      case 'mortar':{
        if(--e.fireT<=0){
          const dx=pcx-(e.x+8), tt=52;
          ebullets.push({x:e.x+7,y:e.y-2,w:5,h:5,vx:dx/tt,vy:-(GRAV*0.5*tt)/2 - 1.2,life:200,col:'#c9a8ff',arc:true,t:0});
          Audio_.tone(160,0.12,'triangle',0.10,0.5);
          e.fireT=rndi(90,150);
        }
        break; }
      case 'drone':{
        e.t2=(e.t2||0)+1;
        e.x += Math.sign(pcx-e.x)*0.9 + Math.cos(e.t*0.05)*0.6;
        e.y = clamp(e.y + Math.sin(e.t*0.06)*0.9 + Math.sign(pcy-40-e.y)*0.25, 16, 150);
        if(--e.fireT<=0){ eShoot(e,pcx,pcy,2.6,'#8be9ff'); e.fireT=rndi(70,120); }
        break; }
    }
    if(e.x < cam.x-140 || e.x > cam.max+W+180) if(e.type==='runner'||e.type==='gunner') e.dead=true;
  }
  enemies=enemies.filter(e=>!e.dead);
}
function landEnemy(e){
  e.onG=false;
  for(const pl of plats){
    const top=pl.y;
    if(e.x+e.w>pl.x && e.x<pl.x+pl.w && e.y+e.h>=top && e.y+e.h<=top+ (e.vy>0?e.vy+4:4) && e.vy>=0){
      e.y=top-e.h; e.vy=0; e.onG=true; break;
    }
  }
  if(e.y>H+40) e.dead=true;
}
function dist(a,b){ return Math.hypot((a.x+ (a.w||12)/2)-(b.x+5), (a.y+(a.h||20)/2)-(b.y+11)); }

/* ------------------------------------------------------------------- boss */
function startBoss(){
  cam.lock=true; bossActive=true;
  /* Pods + core protrude from the wall face (x=3272) so shots reach them before
     the solid. Heights are chosen so each is hit at 45-deg from a distinct
     standing distance — that is the whole fight: pick your range. */
  boss={ x:3272, pods:[
      {x:3262,y:32, w:26,h:26,hp:16,fireT:80, dead:false,flash:0,ang:Math.PI},
      {x:3262,y:120,w:26,h:26,hp:16,fireT:140,dead:false,flash:0,ang:Math.PI}],
    core:{x:3266,y:76,w:22,h:22,hp:44,flash:0,dead:false}, t:0, droneT:200, dying:0 };
  Audio_.tone(70,1.1,'sawtooth',0.22,0.6);
  floats.push({x:cam.x+W/2, y:74, s:'WARNING', col:'#ff4d4d', t:0, life:110, big:true});
  shake=6;
}
function updateBoss(){
  if(!boss) return;
  boss.t++;
  const p=player, h=hb(p), pcx=h.x+h.w/2, pcy=h.y+h.h/2;
  if(boss.dying>0){
    boss.dying++;
    if(boss.dying%7===0){ explode(boss.x+rnd(70,-8), rnd(160,20), boss.dying%3===0); shake=Math.max(shake,7); }
    if(boss.dying>110){ boss=null; bossActive=false; stageClear(); }
    return;
  }
  for(const pod of boss.pods){
    if(pod.dead) continue;
    if(pod.flash>0) pod.flash--;
    const a=Math.atan2(pcy-(pod.y+13), pcx-(pod.x+13));
    pod.ang += Math.atan2(Math.sin(a-pod.ang),Math.cos(a-pod.ang))*0.05;
    if(--pod.fireT<=0){
      if(pod.burst===undefined||pod.burst<=0) pod.burst=4;
      const bx=pod.x+13+Math.cos(pod.ang)*14, by=pod.y+13+Math.sin(pod.ang)*14;
      ebullets.push({x:bx-2.5,y:by-2.5,w:5,h:5,vx:Math.cos(pod.ang)*2.9,vy:Math.sin(pod.ang)*2.9,life:260,col:'#ff5c3a',t:0});
      Audio_.tone(220,0.06,'square',0.09,0.6);
      pod.burst--; pod.fireT = pod.burst>0?10:rndi(80,130);
    }
  }
  const c=boss.core;
  if(c.flash>0) c.flash--;
  if(boss.t%150===0){
    for(let i=0;i<7;i++){ const a=Math.PI + (i-3)*0.28;
      ebullets.push({x:c.x+4,y:c.y+10,w:5,h:5,vx:Math.cos(a)*2.2,vy:Math.sin(a)*2.2,life:280,col:'#ffe27a',t:0}); }
    Audio_.tone(140,0.2,'sawtooth',0.14,0.5);
  }
  if(--boss.droneT<=0){ enemies.push(mkDrone(cam.x+W-20, rnd(120,30))); boss.droneT=rndi(190,300); }
}
function stageClear(){ state='CLEAR'; stateT=0; player.walkOut=true; score+=5000; }

/* --------------------------------------------------------------- collision */
function updateBullets(){
  for(const b of bullets){
    b.t++;
    if(b.flame){ b.base+=0; b.ph+=0.34;
      const s=WEAPONS.F.spd; const off=Math.sin(b.ph)*1.9;
      b.x+=Math.cos(b.base)*s - Math.sin(b.base)*off*0.5;
      b.y+=Math.sin(b.base)*s + Math.cos(b.base)*off*0.5;
    } else { b.x+=b.vx; b.y+=b.vy; }
    if(--b.life<=0) b.dead=true;
    if(b.x<cam.x-20||b.x>cam.x+W+20||b.y<-20||b.y>H+20) b.dead=true;
    /* solids */
    for(const s of solids) if(b.x>s.x&&b.x<s.x+s.w&&b.y>s.y&&b.y<s.y+s.h){ b.dead=true; spark(b.x,b.y,3,'#ffd6a0',1.4,10); }
    /* enemies */
    for(const e of enemies){
      if(e.dead) continue;
      if(b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y){
        hurtEnemy(e,b.dmg); if(!b.pierce) b.dead=true; break;
      }
    }
    /* pickups (falcon) */
    for(const f of pickups) if(f.type==='falcon'&&!f.dead&&b.x<f.x+f.w&&b.x+b.w>f.x&&b.y<f.y+f.h&&b.y+b.h>f.y){
      f.dead=true; b.dead=true; explode(f.x+8,f.y+6,false);
      pickups.push(mkItem(f.x, f.y, f.wp)); score+=300;
    }
    /* boss */
    if(boss&&!boss.dying){
      for(const pod of boss.pods) if(!pod.dead&&hitBox(b,pod)){
        pod.hp-=b.dmg; pod.flash=4; if(!b.pierce)b.dead=true; spark(b.x,b.y,4,'#ffd6a0',1.6,12); Audio_.hit();
        if(pod.hp<=0){ pod.dead=true; explode(pod.x+13,pod.y+13,true); score+=1500; floatText(pod.x,pod.y,'1500','#ffd23f'); }
        break;
      }
      const c=boss.core;
      if(!b.dead&&hitBox(b,c)){
        c.hp-=b.dmg; c.flash=4; if(!b.pierce)b.dead=true; spark(b.x,b.y,5,'#8be9ff',1.8,14); Audio_.hit();
        if(c.hp<=0){ boss.dying=1; score+=8000; explode(c.x+11,c.y+11,true); Audio_.boom(true); shake=12; hitstop=10; }
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);

  for(const b of ebullets){
    b.t++;
    if(b.arc) b.vy+=GRAV*0.5;
    b.x+=b.vx; b.y+=b.vy;
    if(--b.life<=0) b.dead=true;
    if(b.x<cam.x-30||b.x>cam.x+W+30||b.y>H+10||b.y<-30) b.dead=true;
    if(b.arc && b.y>GY-4){ b.dead=true; explode(b.x,GY-2,false); if(Math.abs(b.x-(player.x+5))<16&&player.y>GY-30) killPlayer(); }
    if(!player.dead && player.inv<=0 && aabb(b,hb(player))){ b.dead=true; killPlayer(); }
  }
  ebullets=ebullets.filter(b=>!b.dead);
}
function hitBox(b,o){ return b.x<o.x+o.w&&b.x+b.w>o.x&&b.y<o.y+o.h&&b.y+b.h>o.y; }
function hurtEnemy(e,d){
  e.hp-=d; e.flash=4; spark(e.x+e.w/2,e.y+e.h/2,4,'#ffd6a0',1.6,12);
  Audio_.hit();
  if(e.hp<=0){
    e.dead=true; score+=e.score; floatText(e.x,e.y,e.score,'#ffe27a');
    explode(e.x+e.w/2,e.y+e.h/2, e.score>=500);
  }
}
function updatePickups(){
  for(const f of pickups){
    if(f.type==='falcon'){
      f.t++; f.x+=f.vx; f.y=60+Math.sin(f.t*0.045)*30;
      if(f.x>cam.x+W+30||f.x<cam.x-60) f.dead=true;
    } else {
      f.vy=Math.min(4,f.vy+GRAV*0.6); f.y+=f.vy;
      for(const pl of plats){ if(f.x+f.w>pl.x&&f.x<pl.x+pl.w&&f.y+f.h>=pl.y&&f.y+f.h<=pl.y+f.vy+4&&f.vy>0){ f.y=pl.y-f.h; f.vy=0; } }
      if(f.y>H+20) f.dead=true;
      if(--f.life<=0) f.dead=true;
      if(!player.dead && aabb({x:f.x,y:f.y,w:f.w,h:f.h},{x:player.x,y:player.y,w:player.w,h:PH})){
        f.dead=true; grantWeapon(f.wp);
      }
    }
  }
  pickups=pickups.filter(f=>!f.dead);
}
function grantWeapon(wp){
  if(wp==='B'){ player.barrier=600; floatText(player.x,player.y-8,'BARRIER','#c9a8ff'); }
  else { weapon=wp; floatText(player.x,player.y-8,WEAPONS[wp].name,'#7dffa1'); }
  score+=500; Audio_.power();
}
function updateParts(){
  for(const p of parts){
    p.t++;
    if(p.ring){ p.r=lerp(1,p.rmax,p.t/p.life); }
    else if(p.smoke){ p.x+=p.vx*0.4; p.y+=p.vy; p.vy*=0.97; p.r+=0.16; }
    else if(p.flash){ }
    else { p.vx*=0.985; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; }
    if(p.t>=p.life) p.dead=true;
  }
  parts=parts.filter(p=>!p.dead);
  for(const f of floats){ f.t++; f.y-=0.35; if(f.t>=f.life) f.dead=true; }
  floats=floats.filter(f=>!f.dead);
}

/* ----------------------------------------------------------------- camera */
function updateCamera(){
  if(cam.lock){ cam.x=lerp(cam.x, LVL_W-W, 0.10); return; }
  /* touch: frame the player centred, clear of the thumb on the stick.
     desktop keeps the original 38% lead (more of the level visible ahead). */
  const target=clamp(player.x - W*(isTouch?0.50:0.38), 0, LVL_W-W);
  /* follows both ways: you can walk back for enemies left behind. cam.max remembers
     the furthest point reached, so retreating doesn't cull the wave ahead of you */
  cam.x = clamp(lerp(cam.x,target,0.12), 0, LVL_W-W);
  cam.max = Math.max(cam.max, cam.x);
  for(const s of spawns) if(!s.done && cam.max>=s.x){ s.done=true; s.fn(); }
}

/* ------------------------------------------------------------------- draw */
function drawParallax(g){
  const t=frame;
  /* far */
  const fx=-(cam.x*0.14)%512;
  for(let i=-1;i<2;i++) g.drawImage(bgFar, Math.round(fx+i*512), 0);
  /* drifting clouds/fog */
  g.globalAlpha=0.10;
  for(let i=0;i<4;i++){
    const x=((i*130 - cam.x*0.06 - t*0.14)%(W+180))-90;
    const y=54+i*11;
    g.fillStyle='#ffd9c0'; g.beginPath(); g.ellipse(x,y,52,6,0,0,TAU); g.fill();
  }
  g.globalAlpha=1;
  const mx=-(cam.x*0.34)%480;
  for(let i=-1;i<2;i++) g.drawImage(bgMid, Math.round(mx+i*480), 0);
  const nx=-(cam.x*0.62)%420;
  for(let i=-1;i<2;i++) g.drawImage(bgNear, Math.round(nx+i*420), Math.round(2+Math.sin(t*0.01)*1));
}
function drawWater(g){
  const t=frame;
  for(const p of pits){
    const sx=p.x-cam.x; if(sx>W||sx+p.w<0) continue;
    for(let y=GY+6;y<H;y+=4){
      const off=Math.sin((y*0.6)+t*0.06)*3;
      g.fillStyle=`rgba(120,200,255,${0.05+0.05*Math.sin(t*0.05+y)})`;
      g.fillRect(Math.round(sx+off), y, p.w, 1);
    }
    g.fillStyle='rgba(160,220,255,.18)';
    for(let i=0;i<p.w;i+=9){ const yy=GY+10+Math.sin((i+t*1.6)*0.08)*3; g.fillRect(Math.round(sx+i),Math.round(yy),4,1); }
  }
}
function drawPlayer(g){
  const p=player;
  if(p.dead){
    g.save(); g.translate(Math.round(p.x-cam.x+5), Math.round(p.y+8)); g.rotate(p.spinT);
    const white = (p.deadT<10 && (p.deadT>>1)%2===0);
    blit(g,SPR.ball,-8,-8,false,white); g.restore(); return;
  }
  if(p.inv>0 && (frame>>1)%2===0 && !p.walkOut) return;
  const sx=p.x-cam.x, flip=p.dir<0;
  if(p.barrier>0){
    g.save(); g.globalAlpha=0.35+0.25*Math.sin(frame*0.25);
    g.strokeStyle='#c9a8ff'; g.lineWidth=1;
    g.beginPath(); g.arc(sx+5, p.y+11, 15+Math.sin(frame*0.2), 0, TAU); g.stroke(); g.restore();
  }
  if(p.shield>0 || p.shieldFlash>0){
    g.save();
    const f=p.shieldFlash;
    g.globalAlpha = f>0 ? 0.30+0.55*(f/14) : 0.12+0.05*p.shield+0.04*Math.sin(frame*0.11);
    g.strokeStyle='#7fe3ff'; g.lineWidth=1;
    g.beginPath(); g.arc(sx+5, p.y+11, 13+(f>0?(14-f)*0.45:0), 0, TAU); g.stroke();
    g.restore();
  }
  if(p.prone){ blit(g,SPR.prone, sx-(flip?11:2), p.y+12, flip); drawGunArm(g,sx,p.y+12,true); return; }
  if(!p.onGround){
    g.save(); g.translate(Math.round(sx+5), Math.round(p.y+11));
    g.rotate(p.spinT*p.dir); blit(g,SPR.ball,-8,-8,flip); g.restore(); return;
  }
  blit(g, SPR.run[p.frameI], sx-3, p.y-2, flip);
  drawGunArm(g,sx,p.y,false);
}
function drawGunArm(g,sx,py,prone){
  const p=player;
  const ox=sx+5, oy=py+(prone?4:8);
  const a=p.aim;
  g.save(); g.translate(Math.round(ox),Math.round(oy)); g.rotate(a);
  g.fillStyle='#ffcf9e'; g.fillRect(0,-1,7,3);          /* arm */
  g.fillStyle='#2b2f38'; g.fillRect(5,-2,9,4);           /* gun body */
  g.fillStyle='#6d7784'; g.fillRect(7,-1,7,1);
  g.fillStyle='#1a1d23'; g.fillRect(12,-1,3,2);
  if(p.fireCd>WEAPONS[weapon].cd-4){
    g.fillStyle='#fff6c2'; g.fillRect(14,-2,4,4);
    g.fillStyle='#ffb02e'; g.fillRect(16,-1,3,2);
  }
  g.restore();
}
function drawEnemy(g,e){
  const sx=Math.round(e.x-cam.x), sy=Math.round(e.y);
  const wf=e.flash>0;
  switch(e.type){
    case 'runner': case 'gunner': case 'jumper':{
      const fi = e.type==='gunner'?0:(1+(Math.floor(e.t*0.18)%3));
      blit(g,SPR.erun[e.type==='jumper'?2:fi], sx-2, sy-2, e.dir>0, wf);
      /* muzzle-ish rifle */
      g.fillStyle=wf?'#ffdcd0':'#2b2f38';
      g.fillRect(sx+(e.dir>0?10:-2), sy+8, 6, 2);
      break; }
    case 'turret':{
      /* housing first, barrel on top so it actually reads as aiming */
      g.fillStyle=wf?'#ffdcd0':'#4d5561'; g.fillRect(sx,sy+4,16,10);
      g.fillStyle=wf?'#ffdcd0':'#68727f'; g.fillRect(sx+1,sy+4,14,2);
      g.fillStyle='#23272e'; g.fillRect(sx,sy+12,16,2);
      g.beginPath(); g.fillStyle=wf?'#ffdcd0':'#3b434e'; g.arc(sx+8,sy+7,6,Math.PI,0); g.fill();
      g.save(); g.translate(sx+8, sy+7); g.rotate(e.ang);
      g.fillStyle=wf?'#ffdcd0':'#39404a'; g.fillRect(0,-3,14,6);
      g.fillStyle=wf?'#ffdcd0':'#78838f'; g.fillRect(2,-2,11,1);
      g.fillStyle='#14171c'; g.fillRect(12,-2,4,4); g.restore();
      g.beginPath(); g.fillStyle=(e.fireT<20)?'#ff4d4d':'#7d2b2b'; g.arc(sx+8,sy+7,3,0,TAU); g.fill();
      break; }
    case 'bunker':{
      g.fillStyle=wf?'#ffdcd0':'#4a4238'; g.fillRect(sx,sy,22,22);
      g.fillStyle=wf?'#ffdcd0':'#5d5448'; g.fillRect(sx,sy,22,3);
      g.fillStyle='#211d18'; g.fillRect(sx,sy+19,22,3);
      for(let i=0;i<3;i++){ g.fillStyle='rgba(0,0,0,.3)'; g.fillRect(sx+2+i*7,sy+4,5,14); }
      const oh=Math.round(2+e.open*5);
      g.fillStyle='#0b0d10'; g.fillRect(sx+4,sy+7,14,oh);
      if(e.open>0.5){ g.fillStyle='#e8b183'; g.fillRect(sx+9,sy+8,5,4);
        g.fillStyle='#2b2f38'; g.fillRect(sx+2,sy+10,8,2); }
      g.fillStyle='#c8b53a'; g.fillRect(sx+1,sy+1,3,2); g.fillRect(sx+18,sy+1,3,2);
      break; }
    case 'mortar':{
      g.fillStyle=wf?'#ffdcd0':'#3f4a3a'; g.fillRect(sx,sy+6,16,10);
      g.fillStyle=wf?'#ffdcd0':'#57654f'; g.fillRect(sx,sy+6,16,2);
      g.save(); g.translate(sx+8,sy+8); g.rotate(-1.05);
      g.fillStyle=wf?'#ffdcd0':'#2b2f38'; g.fillRect(-2,-3,14,6); g.fillStyle='#6d7784'; g.fillRect(0,-2,11,1); g.restore();
      g.fillStyle='#23272e'; g.fillRect(sx,sy+14,16,2);
      g.fillStyle=(e.fireT<22)?'#ffd23f':'#6a5a20'; g.fillRect(sx+2,sy+9,3,3);
      break; }
    case 'drone':{
      const bob=Math.sin(e.t*0.2)*1;
      g.fillStyle=wf?'#ffdcd0':'#39404a'; g.fillRect(sx,sy+bob,12,7);
      g.fillStyle=wf?'#ffdcd0':'#59616d'; g.fillRect(sx+1,sy+bob,10,2);
      g.fillStyle='#8be9ff'; g.fillRect(sx+4,sy+3+bob,4,2);
      g.fillStyle='rgba(140,220,255,.35)';
      const wsp=(frame%4<2)?3:1;
      g.fillRect(sx-4,sy+1+bob,4,wsp); g.fillRect(sx+12,sy+1+bob,4,wsp);
      break; }
  }
}
function drawFalcon(g,f){
  const sx=Math.round(f.x-cam.x), sy=Math.round(f.y);
  const flap=Math.sin(f.t*0.22);
  /* wings behind the fuselage, dark with a lit leading edge */
  for(const s of [1,-1]){
    g.save(); g.translate(sx+8,sy+5); g.rotate(flap*0.55*s);
    g.fillStyle='#39414f'; g.fillRect(s>0?0:-10, -1, 10, 4);
    g.fillStyle='#7c8798'; g.fillRect(s>0?0:-10, -1, 10, 1);
    g.restore();
  }
  /* fuselage */
  g.fillStyle='#4a5464'; g.fillRect(sx+3,sy+3,11,6);
  g.fillStyle='#8e99aa'; g.fillRect(sx+3,sy+3,11,1);
  g.fillStyle='#232a35'; g.fillRect(sx+3,sy+8,11,1);
  g.fillStyle='#101419'; g.fillRect(sx+13,sy+4,3,4);          /* nose */
  /* pulsing carrier light */
  const pl=0.55+0.45*Math.sin(f.t*0.3);
  g.fillStyle=`rgba(255,60,70,${pl})`; g.fillRect(sx+9,sy+5,3,2);
  g.fillStyle=`rgba(255,180,190,${pl*0.9})`; g.fillRect(sx+10,sy+5,1,1);
  /* thruster wash */
  g.fillStyle=`rgba(255,200,90,${0.35+0.25*Math.sin(f.t*0.5)})`; g.fillRect(sx,sy+5,3,2);
  g.fillStyle='rgba(255,140,60,.25)'; g.fillRect(sx-3,sy+6,3,1);
}
function drawItem(g,f){
  const sx=Math.round(f.x-cam.x), sy=Math.round(f.y);
  const bl=f.life<180 && (frame>>2)%2===0;
  if(bl) return;
  g.fillStyle='#e63946'; g.fillRect(sx,sy,15,12);
  g.fillStyle='#ff7b84'; g.fillRect(sx,sy,15,1); g.fillRect(sx,sy,1,12);
  g.fillStyle='#8d1c26'; g.fillRect(sx,sy+11,15,1); g.fillRect(sx+14,sy,1,12);
  g.fillStyle='#241318'; g.fillRect(sx+2,sy+2,11,8);
  drawText(g,f.wp,sx+5,sy+3,'#ffe27a',1);
  g.globalAlpha=0.25+0.2*Math.sin(frame*0.18); g.fillStyle='#fff'; g.fillRect(sx,sy,15,12); g.globalAlpha=1;
}
function drawBoss(g){
  if(!boss) return;
  const bx=boss.x-cam.x;
  /* mounting spine bolted to the gate face */
  g.fillStyle='#2a2f38'; g.fillRect(bx-8,20,12,140);
  g.fillStyle='#3d444f'; g.fillRect(bx-8,20,12,3);
  g.fillStyle='#171b20'; g.fillRect(bx-8,157,12,3);
  for(let i=26;i<156;i+=13){ g.fillStyle='#5b6470'; g.fillRect(bx-6,i,3,3); g.fillRect(bx,i,3,3); }
  for(const pod of boss.pods){
    const px=pod.x-cam.x, py=pod.y;
    if(pod.dead){
      g.fillStyle='#161a1f'; g.fillRect(px,py,26,26);
      g.fillStyle='#0a0c0f'; g.fillRect(px+4,py+4,18,18);
      if(frame%9<4){ g.fillStyle='#ff7a2f'; g.fillRect(px+6+rndi(0,10),py+6+rndi(0,10),3,3); }
      continue;
    }
    const wf=pod.flash>0;
    g.fillStyle=wf?'#ffdcd0':'#4d5561'; g.fillRect(px,py,26,26);
    g.fillStyle=wf?'#ffdcd0':'#69737f'; g.fillRect(px+1,py+1,24,2);
    g.fillStyle='#22262c'; g.fillRect(px+1,py+23,24,2);
    g.beginPath(); g.fillStyle=wf?'#ffdcd0':'#333a44'; g.arc(px+13,py+13,10,0,TAU); g.fill();
    /* barrel over the housing so the aim is legible */
    g.save(); g.translate(px+13,py+13); g.rotate(pod.ang);
    g.fillStyle=wf?'#ffdcd0':'#39404a'; g.fillRect(0,-4,18,8);
    g.fillStyle=wf?'#ffdcd0':'#7e8998'; g.fillRect(2,-3,15,2);
    g.fillStyle='#14171c'; g.fillRect(15,-3,4,6); g.restore();
    g.beginPath(); g.fillStyle=(pod.fireT<24)?'#ff4d4d':'#7d2b2b'; g.arc(px+13,py+13,4,0,TAU); g.fill();
    if(pod.fireT<24){ g.beginPath(); g.fillStyle='rgba(255,77,77,.28)'; g.arc(px+13,py+13,8,0,TAU); g.fill(); }
    for(let i=0;i<4;i++){ g.fillStyle='#828d9b'; g.fillRect(px+2+ (i%2)*21, py+3+((i/2)|0)*19, 2,2); }
  }
  const c=boss.core, cx=c.x-cam.x;
  const wf=c.flash>0, pulse=0.5+0.5*Math.sin(frame*0.14);
  /* core: an armoured lens set into the gate */
  g.fillStyle=wf?'#ffdcd0':'#2c323b'; g.fillRect(cx-3,c.y-3,28,28);
  g.fillStyle='#8a96a5'; g.fillRect(cx-3,c.y-3,28,2); g.fillRect(cx-3,c.y+23,28,2);
  for(let i=0;i<4;i++){ g.fillStyle='#5b6470'; g.fillRect(cx-2+(i%2)*25, c.y-2+((i/2)|0)*24, 3,3); }
  g.fillStyle='#12161b'; g.fillRect(cx,c.y,22,22);
  const hpr=clamp(c.hp/44,0,1);
  const r0=Math.round(90+110*hpr);
  g.beginPath(); g.fillStyle=`rgba(255,${r0},60,${0.30+0.22*pulse})`; g.arc(cx+11,c.y+11,11,0,TAU); g.fill();
  g.beginPath(); g.fillStyle=`rgba(255,${r0},70,${0.72+0.28*pulse})`; g.arc(cx+11,c.y+11,7.5,0,TAU); g.fill();
  g.beginPath(); g.fillStyle=`rgba(255,246,214,${0.55+0.45*pulse})`; g.arc(cx+11,c.y+11,3.4,0,TAU); g.fill();
  g.fillStyle='rgba(10,12,16,.65)';
  for(let i=0;i<3;i++) g.fillRect(cx+1, c.y+5+i*6, 20,1);
  /* boss hp bar — sits under the HUD strip, clear of the weapon readout */
  if(!boss.dying){
    const total=boss.pods.reduce((a,p)=>a+Math.max(0,p.hp),0)+Math.max(0,c.hp);
    const frac=clamp(total/76,0,1);
    g.fillStyle='rgba(6,8,12,.72)'; g.fillRect(W-132,14,128,9);
    drawText(g,'GATE',W-129,16,'#ff8a8a',1);
    g.fillStyle='#3a1418'; g.fillRect(W-102,17,96,3);
    g.fillStyle= frac>0.5?'#ff5c3a': frac>0.22?'#ffb02e':'#ff2f4d';
    g.fillRect(W-102,17,Math.round(96*frac),3);
    g.fillStyle='rgba(255,255,255,.25)'; g.fillRect(W-102,17,Math.round(96*frac),1);
  }
}
function drawParts(g){
  for(const p of parts){
    const sx=Math.round(p.x-cam.x), sy=Math.round(p.y);
    if(p.ring){
      const a=1-p.t/p.life;
      g.strokeStyle=`rgba(255,220,150,${a*0.8})`; g.lineWidth=1;
      g.beginPath(); g.arc(sx,sy,p.r,0,TAU); g.stroke();
      g.strokeStyle=`rgba(255,120,50,${a*0.5})`; g.beginPath(); g.arc(sx,sy,p.r*0.6,0,TAU); g.stroke();
    } else if(p.smoke){
      const a=(1-p.t/p.life)*0.30;
      g.fillStyle=`rgba(90,90,100,${a})`; g.beginPath(); g.arc(sx,sy,p.r,0,TAU); g.fill();
    } else if(p.flash){
      g.save(); g.translate(sx,sy); g.rotate(p.a);
      const a=1-p.t/p.life;
      g.fillStyle=`rgba(255,246,194,${a})`; g.fillRect(0,-2,7,4); g.fillRect(3,-4,3,8);
      g.restore();
    } else {
      const a=1-p.t/p.life;
      g.globalAlpha=clamp(a*1.4,0,1); g.fillStyle=p.col;
      g.fillRect(sx,sy,p.sz,p.sz); g.globalAlpha=1;
    }
  }
}
function drawBullets(g){
  for(const b of bullets){
    const sx=Math.round(b.x-cam.x), sy=Math.round(b.y);
    if(b.kind==='L'){
      g.save(); g.translate(sx+1,sy+1); g.rotate(Math.atan2(b.vy,b.vx));
      g.fillStyle='rgba(139,233,255,.35)'; g.fillRect(-14,-2,28,4);
      g.fillStyle='#8be9ff'; g.fillRect(-10,-1,20,2);

    } else if(b.kind==='F'){
      g.fillStyle='rgba(255,107,61,.35)'; g.fillRect(sx-2,sy-2,7,7);

      g.fillStyle='#fff3c4'; g.fillRect(sx,sy,3,3);

      g.fillStyle='rgba(255,255,200,.25)'; g.fillRect(sx-1,sy-1,5,5);

  for(const b of ebullets){

}
function drawHUD(g){
  /* top bar */
  g.fillStyle='rgba(6,8,12,.55)'; g.fillRect(0,0,W,11);
  g.fillStyle='rgba(230,57,70,.55)'; g.fillRect(0,11,W,1);
  drawText(g,'1UP',4,2,'#e63946',1);
  drawText(g,String(score).padStart(6,'0'),22,2,'#ffe27a',1);
  /* lives */
  const shown=Math.min(lives,6);
  for(let i=0;i<shown;i++) blit(g,SPR.head, 92+i*9, 1, false);
  if(lives>6) drawText(g,'X'+lives, 92+7*9, 2,'#fff',1);
  /* shield pips, with the out-of-combat recharge running underneath them */
  if(player){
    for(let i=0;i<SHIELD_MAX;i++){
      const x=160+i*8;
      g.fillStyle = i<player.shield ? '#7fe3ff' : 'rgba(127,227,255,.16)';
      g.fillRect(x,3,6,5);
    }
    if(player.shield<SHIELD_MAX){
      const bw=SHIELD_MAX*8-2, pr=clamp(player.regenT/SHIELD_REGEN,0,1);
      g.fillStyle='rgba(127,227,255,.22)'; g.fillRect(160,9,bw,1);
      g.fillStyle='#7fe3ff'; g.fillRect(160,9,Math.round(bw*pr),1);
    }
  }
  /* weapon */
  const w=WEAPONS[weapon];
  g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(W-96,1,44,9);
  g.strokeStyle='#4b5462'; g.lineWidth=1; g.strokeRect(W-96.5,1.5,44,8);
  drawText(g,w.name.slice(0,7),W-93,2,w.col,1);
  if(player&&player.barrier>0) drawText(g,'BAR',W-50,2,'#c9a8ff',1);
  /* progress */
  const pr=clamp(cam.x/(LVL_W-W),0,1);
  g.fillStyle='rgba(255,255,255,.10)'; g.fillRect(4,H-4,W-8,2);
  g.fillStyle='#e63946'; g.fillRect(4,H-4,Math.round((W-8)*pr),2);
  g.fillStyle='#ffe27a'; g.fillRect(4+Math.round((W-8)*pr)-1,H-5,2,4);
}

/* -------------------------------------------------------------- title art */
let titleT=0;
function drawTitle(g){
  titleT++;
  drawParallax(g);
  g.drawImage(groundCv, 0, 0, W, H, 0, 0, W, H);
  g.fillStyle='rgba(4,6,12,.55)'; g.fillRect(0,0,W,H);
  /* logo */
  const cx=W/2, y=44+Math.sin(titleT*0.03)*2;
  for(let i=6;i>0;i--){
    drawTextC(g,'CONTRA',cx,y+i, `rgba(${20+i*6},${8+i*3},${16+i*4},1)`,5);
  }
  /* red -> gold, going the short way round the wheel (352 -> 390 == 30) */
  const grad=(t)=>`hsl(${lerp(352,392,t)%360},${lerp(82,94,t)}%,${lerp(48,60,t)}%)`;
  /* draw logo scanline-gradient by clipping */
  const logoY=Math.round(y), sc=5;
  for(let r=0;r<7;r++){
    const s='CONTRA'; const x0=Math.round(cx-textW(s,sc)/2);
    g.fillStyle=grad(r/6);
    for(let i=0;i<s.length;i++){ const gl=GLYPH[s[i]];
      for(let c=0;c<5;c++) if(gl[r][c]==='1') g.fillRect(x0+i*6*sc+c*sc, logoY+r*sc, sc, sc); }
  }
  /* silver shine sweep */
  const sweep=((titleT*2)%260)-40;
  g.save(); g.globalCompositeOperation='lighter';
  for(let r=0;r<7;r++){ const s='CONTRA', x0=Math.round(cx-textW(s,sc)/2);
    for(let i=0;i<s.length;i++){ const gl=GLYPH[s[i]];
      for(let c=0;c<5;c++) if(gl[r][c]==='1'){
        const px=x0+i*6*sc+c*sc, d=Math.abs(px-(cx-110+sweep));
        if(d<16){ g.fillStyle=`rgba(255,255,255,${(1-d/16)*0.55})`; g.fillRect(px,logoY+r*sc,sc,sc); } } } }
  g.restore();
  drawTextC(g,'STAGE 1  -  JUNGLE',cx,86,'#9fb4c8',1);
  g.fillStyle='#e63946'; g.fillRect(cx-70,96,140,1);

  if((titleT>>4)%2===0) drawTextCSh(g,isTouch?'TAP TO START':'PRESS ENTER',cx,112,'#ffe27a','#3a1a10',2);
  drawTextC(g,isTouch?'FIRE    JUMP    STICK AIMS 8 WAYS':'Z FIRE    X JUMP    ARROWS AIM',cx,136,'#6c7b8e',1);
  drawTextC(g,isTouch?'HOLD DOWN + JUMP TO DROP THROUGH LEDGES':'HOLD DOWN + X TO DROP THROUGH LEDGES',cx,147,'#4e5a6b',1);
  if(konamiOn) drawTextC(g,'* 30 LIVES ACTIVATED *',cx,162,(titleT>>3)%2?'#ffd23f':'#ff6b3d',1);
  else drawTextC(g,'...UP UP DOWN DOWN...',cx,162,'#39424f',1);
  g.fillStyle='rgba(4,6,12,.72)'; g.fillRect(0,H-20,W,20);
  drawTextC(g,'AN HTML5 HOMAGE  -  NOT AFFILIATED WITH KONAMI',cx,H-13,'#3f4956',1);
}

/* ------------------------------------------------------------------- loop */
function update(){
  frame++;
  Audio_.tick();
  if(hitstop>0){ hitstop--; return; }
  if(state==='PLAY'){
    stageTime++;
    updatePlayer();
    if(!player.walkOut){
      updateEnemies(); updateBullets(); updatePickups();
      if(bossActive) updateBoss();
      /* enemy body contact */
      if(!player.dead && player.inv<=0){
        for(const e of enemies){
          if(e.type==='bunker'||e.type==='mortar'||e.type==='turret') continue;
          if(aabb({x:e.x,y:e.y,w:e.w,h:e.h},hb(player))) { killPlayer(); break; }
        }
      }
      updateCamera();
    } else { updateParts(); }
  } else if(state==='CLEAR'){
    stateT++; updatePlayer(); updateParts();
    if(stateT%22===0) explode(cam.x+rnd(W,20), rnd(120,20), stateT%44===0);
  } else if(state==='GAMEOVER'){ stateT++; updateParts(); }
  updateParts();
  if(shake>0) shake*=0.86;
}
function render(){
  const g=ctx;
  g.save();
  const sh = shake>0.2 ? shake : 0;
  if(sh) g.translate(Math.round(rnd(sh,-sh)), Math.round(rnd(sh,-sh)));

  if(state==='TITLE'){ drawTitle(g); g.restore(); postFX(g); return; }

  drawParallax(g);
  /* terrain slice, then animated water inside the chasms */
  const cx=Math.round(cam.x);
  g.drawImage(groundCv, cx, 0, W, H, 0, 0, W, H);
  drawWater(g);

  for(const f of pickups){ if(f.type==='falcon') drawFalcon(g,f); else drawItem(g,f); }
  for(const e of enemies) drawEnemy(g,e);
  if(boss) drawBoss(g);
  drawParts(g);
  if(player) drawPlayer(g);
  drawBullets(g);
  /* foreground foliage */
  g.globalAlpha=0.92; g.drawImage(fgCv, cx, 0, W, H, 0, 0, W, H); g.globalAlpha=1;

  for(const f of floats){
    const a=1-f.t/f.life;
    g.globalAlpha=clamp(a*1.6,0,1);
    if(f.big) drawTextCSh(g,f.s,f.x-cam.x,f.y,f.col,'#20101a',2);
    else drawTextSh(g,f.s,Math.round(f.x-cam.x),Math.round(f.y),f.col,'#20101a',1);
    g.globalAlpha=1;
  }
  drawHUD(g);
  g.restore();

  if(state==='CLEAR'){
    g.fillStyle=`rgba(4,6,12,${clamp(stateT/120,0,.72)})`; g.fillRect(0,0,W,H);
    if(stateT>40){
      drawTextCSh(g,'STAGE 1 CLEAR',W/2,70,'#ffe27a','#5a1f14',3);
      drawTextC(g,'SCORE  '+String(score).padStart(6,'0'),W/2,104,'#9fe8ff',1);
      drawTextC(g,'TIME   '+String(Math.floor(stageTime/60)).padStart(3,'0')+' SEC',W/2,118,'#9fe8ff',1);
      if(stateT>110 && (stateT>>4)%2===0) drawTextCSh(g,isTouch?'TAP TO GO ON':'PRESS ENTER',W/2,142,'#ffffff','#2a1a12',2);
      drawTextC(g,'TO BE CONTINUED',W/2,H-30,'#6d7a8c',1);
    }
  }
  if(state==='GAMEOVER'){
    g.fillStyle=`rgba(6,2,4,${clamp(stateT/70,0,.80)})`; g.fillRect(0,0,W,H);
    if(stateT>25){
      drawTextCSh(g,'GAME OVER',W/2,84,'#e63946','#2a0a0e',3);
      drawTextC(g,'SCORE  '+String(score).padStart(6,'0'),W/2,116,'#c8d3e0',1);
      if(stateT>75 && (stateT>>4)%2===0) drawTextCSh(g,isTouch?'TAP TO GO ON':'PRESS ENTER',W/2,136,'#ffe27a','#2a0a0e',2);
    }
  }
  postFX(g);
}
function postFX(g){
  if(fade>0){ g.fillStyle=`rgba(0,0,0,${clamp(fade,0,1)})`; g.fillRect(0,0,W,H); }
}

let acc=0,last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=now-last; last=now; if(dt>200) dt=200;
  acc+=dt;
  const STEP=1000/60;
  let guard=0;
  while(acc>=STEP && guard<4){ acc-=STEP; update(); clearPressed(); guard++; }
  if(guard===4) acc=0;
  render();
}
function clearPressed(){ for(const k in pressed) pressed[k]=false; }

/* -------------------------------------------------------------- state mgr */
function doStart(){
  Audio_.init(); Audio_.resume();
  if(state==='TITLE'){ resetRun(); state='PLAY'; Audio_.coin(); }
  else if(state==='CLEAR'&&stateT>110){ state='TITLE'; titleT=0; }
  else if(state==='GAMEOVER'&&stateT>75){ state='TITLE'; titleT=0; }
}
addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(actionFor(e)!=='start') return;
  doStart();
});

/* ------------------------------------------------------------ touch input */
/* the on-screen pad feeds the same keys/pressed maps the keyboard does, so the
   game logic below is untouched. multi-touch is tracked per identifier, which is
   what lets you hold a direction and fire/jump at the same time (and down+jump
   to drop through a ledge). */
/* Touch capability alone is not enough: most Windows laptops report maxTouchPoints>0
   while being driven with a mouse. Only treat it as a touch device when the PRIMARY
   pointer is coarse (phone/tablet), or when there is no fine pointer anywhere. */
const mq = q => !!(window.matchMedia && matchMedia(q).matches);
const canTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
const isTouch = canTouch && (mq('(pointer:coarse)') || !mq('(any-pointer:fine)'));
document.body.className = isTouch ? 'touch' : 'no-touch';
if(isTouch){
  const zone=document.getElementById('stickZone'), stick=document.getElementById('stick'),
        nub=document.getElementById('nub'), DIRS=['l','r','u','d'],
        DEAD=18, HYST=8;
  /* Eight sectors as [centre deg, half-width deg, keys], y down so 90 = down.
     Widths are deliberately uneven: running left/right is the common case and gets
     the widest sectors, the 45 aim stays generous, straight up/down are narrower
     but still comfortably reachable. Widths tile 360 exactly. */
  const SEC=[[0,30,['r']], [49,19,['r','d']], [90,22,['d']], [131,19,['l','d']],
             [180,30,['l']], [229,19,['l','u']], [270,22,['u']], [311,19,['r','u']]];
  let stickId=null, ox=0, oy=0, sec=-1;
  const clearDirs=()=>{ for(const d of DIRS) keys[d]=false; };
  const angDiff=(a,b)=>{ let d=(a-b)%360; if(d>180)d-=360; if(d<-180)d+=360; return d; };
  /* hysteresis: hold the current sector until the thumb is HYST degrees past its
     edge, so a tremor near a boundary can't strobe between two directions */
  function sectorFor(deg){
    if(sec>=0 && Math.abs(angDiff(deg,SEC[sec][0]))<=SEC[sec][1]+HYST) return sec;
    for(let i=0;i<8;i++) if(Math.abs(angDiff(deg,SEC[i][0]))<=SEC[i][1]) return i;
    return sec;
  }
  const ringTo=(x,y)=>{ stick.style.left=(x-RING)+'px'; stick.style.top=(y-RING)+'px'; };
  function ringHome(){
    const z=zone.getBoundingClientRect();
    ringTo(z.left+RING+14, z.bottom-RING-14);
  }
  function aim(dx,dy){
    clearDirs();
    const m=Math.hypot(dx,dy);
    if(m<DEAD){ sec=-1; nub.style.transform='translate(0,0)'; return; }
    sec=sectorFor((Math.atan2(dy,dx)*180/Math.PI+360)%360);
    if(sec>=0) for(const d of SEC[sec][2]){ keys[d]=true; pressed[d]=true; }
    const k=Math.min(1,m/44)*40/m;
    nub.style.transform='translate('+(dx*k).toFixed(1)+'px,'+(dy*k).toFixed(1)+'px)';
  }
  zone.addEventListener('touchstart',e=>{
    e.preventDefault(); if(state!=='PLAY') doStart();
    const t=e.changedTouches[0];
    /* floating origin: the stick centres on wherever the thumb landed, so landing
       is neutral — no direction until you actually move */
    stickId=t.identifier; ox=t.clientX; oy=t.clientY; sec=-1;
    ringTo(ox,oy); stick.classList.add('live');
    clearDirs(); nub.style.transform='translate(0,0)';
  },{passive:false});
  zone.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches) if(t.identifier===stickId) aim(t.clientX-ox,t.clientY-oy);
  },{passive:false});
  const dropStick=e=>{
    e.preventDefault();
    for(const t of e.changedTouches) if(t.identifier===stickId){
      stickId=null; sec=-1; clearDirs();
      nub.style.transform='translate(0,0)'; stick.classList.remove('live'); ringHome(); }
  };
  zone.addEventListener('touchend',dropStick,{passive:false});
  zone.addEventListener('touchcancel',dropStick,{passive:false});
  ringHome(); addEventListener('resize',ringHome);

  function button(id,act){
    const el=document.getElementById(id); let id_=null;
    el.addEventListener('touchstart',e=>{
      e.preventDefault(); if(state!=='PLAY') doStart();
      id_=e.changedTouches[0].identifier; el.classList.add('on');
      if(act==='mute'){ Audio_.init(); Audio_.muted=!Audio_.muted;
        if(Audio_.master) Audio_.master.gain.value=Audio_.muted?0:0.5;
        el.textContent=Audio_.muted?'MUTE':'VOL'; }
      else { keys[act]=true; pressed[act]=true; }
    },{passive:false});
    const up=e=>{
      e.preventDefault();
      for(const t of e.changedTouches) if(t.identifier===id_){
        id_=null; el.classList.remove('on'); if(act!=='mute') keys[act]=false; }
    };
    el.addEventListener('touchend',up,{passive:false});
    el.addEventListener('touchcancel',up,{passive:false});
  }
  button('bFire','fire'); button('bJump','jump'); button('bMute','mute');
  /* tap the playfield to start / advance between screens */
  cv.addEventListener('touchstart',e=>{ e.preventDefault(); if(state!=='PLAY') doStart(); },{passive:false});
  /* suppress pinch-zoom and double-tap zoom, which otherwise fight the canvas */
  for(const g of ['gesturestart','gesturechange','gestureend'])
    addEventListener(g,e=>e.preventDefault(),{passive:false});
  let lastTap=0;
  addEventListener('touchend',e=>{ const n=Date.now(); if(n-lastTap<300) e.preventDefault(); lastTap=n; },{passive:false});
  addEventListener('contextmenu',e=>e.preventDefault());
}

/* ------------------------------------------------------------ mouse input */
/* Left click fires, same as Z. Always registered — a machine can have both a
   touchscreen and a mouse, and gating this on isTouch left such machines with no
   click at all. Instead ignore the synthetic mouse events a tap generates, by
   skipping anything that lands right after a real touch. */
let lastTouchAt=0;
for(const ev of ['touchstart','touchend','touchmove'])
  addEventListener(ev,()=>{ lastTouchAt=Date.now(); },{passive:true,capture:true});
addEventListener('mousedown',e=>{
  if(e.button!==0 || Date.now()-lastTouchAt<700) return;
  e.preventDefault();
  Audio_.init(); Audio_.resume();
  if(state!=='PLAY'){ doStart(); return; }   /* click also starts / advances */
  keys.fire=true; pressed.fire=true;
});
addEventListener('mouseup',e=>{ if(e.button===0) keys.fire=false; });

/* ----------------------------------------------------------------- resize */
function fit(){
  if(isTouch){
    /* phones are small: fill the viewport with a fractional scale rather than
       snapping to an integer one, which would drop a 390px-tall screen to 1x */
    const vv=window.visualViewport, vw=vv?vv.width:innerWidth, vh=vv?vv.height:innerHeight;
    const s=Math.min(vw/W, vh/H);
    cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
    /* how far the stick reaches into the playfield, in game px (getBoundingClientRect
       flushes the layout above, and picks up the safe-area inset for free) */
    /* the ring floats to the thumb now, so this can't key off a fixed rect. cover a thumb
       resting anywhere in the left half of the activation zone (inset included) */
    const zr=document.getElementById('stickZone').getBoundingClientRect(), cr=cv.getBoundingClientRect();
    padLeft = zr.width ? clamp(Math.round((zr.left+zr.width*0.5+RING-cr.left)/s)+8, 0, Math.round(W*0.28)) : 0;
    return;
  }
  const pad=54;
  const s=Math.max(1,Math.min(Math.floor((innerWidth-16)/W), Math.floor((innerHeight-pad)/H)));
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,120));
if(window.visualViewport) visualViewport.addEventListener('resize',fit);

/* ------------------------------------------------------------------ start */
buildSprites();
buildBackdrop();
buildLevel();
resetRun();
state='TITLE';
fit();
requestAnimationFrame(loop);
</script>
</body>
